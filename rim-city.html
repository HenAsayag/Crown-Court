/* ==================================================================
   5. CANVAS + VIEWPORT
   Fixed 450x800 logical space, scaled by devicePixelRatio, capped at
   2x so a 3x phone does not burn a third of the frame on fill rate.
   ================================================================== */
const cv = $("game"), ctx = cv.getContext("2d", { alpha: false });
let SCALE = 1, DPR = 1;
function resize() {
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * DPR);
  cv.height = Math.round(r.height * DPR);
  SCALE = cv.width / W;                 // logical -> device
  bgDirty = true;
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));

/* ==================================================================
   6. FX: screen shake, particles, floating text, flash
   ================================================================== */
const Shake = {
  amt: 0, x: 0, y: 0,
  add(v) { this.amt = Math.min(this.amt + v, 30); },
  update(dt) {
    this.amt = Math.max(0, this.amt - CONFIG.JUICE.SHAKE_DECAY * this.amt * dt - 6 * dt);
    const a = this.amt;
    this.x = rand(-a, a); this.y = rand(-a, a);
  }
};

/* One flat array, reused. Dead particles are swapped to the end so we
   never allocate during a run - that is what keeps the GC quiet. */
const P = [];
function spawnP(o) {
  if (P.length >= CONFIG.JUICE.PARTICLE_CAP) P.shift();
  P.push({
    x:o.x, y:o.y, vx:o.vx||0, vy:o.vy||0, r:o.r||3, life:o.life||.6, t:0,
    c:o.c||"#fff", g:o.g===undefined?600:o.g, shape:o.shape||"dot",
    rot:o.rot||0, vr:o.vr||0, fade:o.fade===undefined?1:o.fade, drag:o.drag||0
  });
}
function burst(x, y, n, opt) {
  for (let i = 0; i < n; i++) {
    const a = opt.dir === undefined ? rand(0, TAU) : opt.dir + rand(-opt.spread, opt.spread);
    const sp = rand(opt.spMin || 80, opt.spMax || 300);
    spawnP({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      r:rand(opt.rMin||2, opt.rMax||5), life:rand(opt.lifeMin||.35, opt.lifeMax||.8),
      c:Array.isArray(opt.c)?pick(opt.c):opt.c, g:opt.g, shape:opt.shape, vr:rand(-9,9), drag:opt.drag });
  }
}
function confetti(x, y) {
  const cols = ["#22e6ff","#ff2e93","#ffb020","#b6ff3a","#ffffff"];
  for (let i = 0; i < CONFIG.JUICE.CONFETTI; i++) {
    spawnP({ x:x+rand(-26,26), y:y+rand(-14,14),
      vx:rand(-230,230), vy:rand(-420,-90), r:rand(2.5,5.5),
      life:rand(.9,1.7), c:pick(cols), g:760, shape:"rect", vr:rand(-14,14), drag:.8 });
  }
}
function updateP(dt) {
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    p.t += dt;
    if (p.t >= p.life) { P.splice(i, 1); continue; }
    p.vy += p.g * dt;
    if (p.drag) { const k = 1 - p.drag * dt; p.vx *= k; p.vy *= k; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
}
function drawP() {
  for (let i = 0; i < P.length; i++) {
    const p = P[i], k = 1 - p.t / p.life;
    ctx.globalAlpha = p.fade ? k : 1;
    ctx.fillStyle = p.c;
    if (p.shape === "rect") {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.r, -p.r * .55, p.r * 2, p.r * 1.1); ctx.restore();
    } else if (p.shape === "spark") {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.fillRect(0, -p.r * .32, p.r * 3.2 * k, p.r * .64); ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * k, 0, TAU); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/* floating "+50 SWISH!" score pops */
const POPS = [];
function pop(x, y, text, color, big) {
  POPS.push({ x, y, text, c:color || "#fff", t:0, life:CONFIG.JUICE.SCORE_POP_TIME, big:!!big });
}
function updatePops(dt) {
  for (let i = POPS.length - 1; i >= 0; i--) {
    POPS[i].t += dt;
    if (POPS[i].t >= POPS[i].life) POPS.splice(i, 1);
  }
}
function drawPops() {
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const p of POPS) {
    const k = p.t / p.life;
    const y = p.y - CONFIG.JUICE.SCORE_POP_RISE * easeOutCubic(k);
    const s = p.big ? 1.25 : 1;
    const scale = (k < .16 ? easeOutBack(k / .16) : 1) * s;
    ctx.save();
    ctx.globalAlpha = k > .65 ? 1 - (k - .65) / .35 : 1;
    ctx.translate(p.x, y); ctx.scale(scale, scale);
    ctx.font = "900 " + (p.big ? 27 : 21) + "px " + FONT;
    ctx.lineWidth = 5; ctx.strokeStyle = "rgba(0,0,0,.55)";
    ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.c; ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
}
const FONT = '"Arial Rounded MT Bold","Nunito",ui-rounded,system-ui,sans-serif';

/* white flash on big moments */
const flashEl = $("flash");
let flashT = 0;
function flash(a) { flashT = a === undefined ? CONFIG.JUICE.FLASH_ALPHA : a; }
function updateFlash(dt) {
  if (flashT > 0) { flashT = Math.max(0, flashT - dt * 2.4); flashEl.style.opacity = flashT; }
  else if (flashEl.style.opacity !== "0") flashEl.style.opacity = "0";
}

/* ==================================================================
   7. GAME STATE
   ================================================================== */
const S = { MENU:"menu", AIM:"aim", FLIGHT:"flight", RESET:"reset", OVER:"over", PAUSED:"paused" };

const G = {
  state: S.MENU,
  mode: "endless",
  level: 0,            // trick-shot level index
  score: 0, baskets: 0, swishes: 0, shots: 0, coinsRun: 0,
  combo: 0,            // consecutive swishes
  mult: 1,
  fire: false, everFire: false, fireT: 0,
  lives: 1, maxLives: 1,
  timeLeft: 0,
  tier: 0,
  bestCombo: 0, longShots: 0, bankShots: 0, obstacleBaskets: 0,
  wind: 0, windTarget: 0,
  timeScale: 1, slowT: 0, slowUsed: false,
  elapsed: 0,
  newBest: false,
  clutchArmed: false
};

const ball = {
  x: CONFIG.START.x, y: CONFIG.START.y, vx: 0, vy: 0, spin: 0,
  r: CONFIG.PHYSICS.BALL_RADIUS, live: false, t: 0, restT: 0,
  touchRim: false, touchBoard: false, touchFloor: false, touchObs: false,
  launchX: 0, launchY: 0, trail: [], rot: 0
};

const hoop = {
  baseX: 330, baseY: 400, x: 330, y: 400,
  tx: 330, ty: 400,                  // target (the hoop eases toward this)
  slideAmp: 0, slideSpeed: 0, slidePhase: 0,
  bobAmp: 0, bobSpeed: 0, bobPhase: 0,
  flex: 0, flexV: 0,                 // rim flex spring (px of droop)
  net: [],                           // per-column horizontal displacement springs
  netV: []
};
for (let i = 0; i <= CONFIG.HOOP.NET_COLS; i++) { hoop.net.push({ x:0, y:0 }); hoop.netV.push({ x:0, y:0 }); }

let obstacles = [];   // live hazards
let walls = [];       // static blocks (trick-shot levels)
let level = null;     // current trick-shot level definition

const equippedBall = () => BALLS.find(b => b.id === SAVE.ball) || BALLS[0];
const equippedCourt = () => COURTS.find(c => c.id === SAVE.court) || COURTS[0];

/* ==================================================================
   8. DIFFICULTY RAMP
   Tier = floor(baskets / STEP). Each tier layers on the next thing:
   further -> sliding -> bobbing -> wind -> obstacles.
   ================================================================== */
const D = CONFIG.DIFFICULTY;
function tierOf(baskets) { return Math.min(D.MAX_TIER, Math.floor(baskets / D.STEP)); }

function applyDifficulty() {
  if (G.mode === "trick") return;             // handcrafted levels ignore the ramp
  const t = G.tier = tierOf(G.baskets);

  // 1. distance: the near edge of the spawn band walks away from you
  const near = Math.min(D.DIST_MIN + t * D.DIST_PER_TIER, D.DIST_MAX - 40);
  const far = Math.min(near + D.DIST_BAND + t * 8, D.DIST_MAX);
  hoop.tx = rand(near, far);
  // the rim also climbs: tier 0 hangs low and friendly, later tiers ride high
  const hiEdge = lerp(D.HEIGHT_EASY, D.HEIGHT_MIN, Math.min(1, t / 4));
  hoop.ty = rand(hiEdge, D.HEIGHT_MAX);

  // 2. horizontal slide
  hoop.slideAmp = t >= D.SLIDE_TIER ? D.SLIDE_RANGE : 0;
  hoop.slideSpeed = t >= D.SLIDE_TIER ? (D.SLIDE_SPEED + (t - D.SLIDE_TIER) * D.SLIDE_SPEED_PER_TIER) / D.SLIDE_RANGE : 0;
  hoop.slidePhase = rand(0, TAU);

  // 3. vertical bob
  hoop.bobAmp = t >= D.BOB_TIER ? D.BOB_RANGE + (t - D.BOB_TIER) * D.BOB_RANGE_PER_TIER : 0;
  hoop.bobSpeed = D.BOB_SPEED;
  hoop.bobPhase = rand(0, TAU);

  // 4. wind
  if (t >= D.WIND_TIER) {
    const mag = Math.min(D.WIND_MIN + (t - D.WIND_TIER) * D.WIND_PER_TIER, D.WIND_MAX);
    G.windTarget = mag * (Math.random() < .5 ? -1 : 1);
  } else G.windTarget = 0;

  // 5. moving obstacles between you and the rim
  obstacles.length = 0;
  if (t >= D.OBSTACLE_TIER) {
    const extra = t - D.OBSTACLE_TIER;
    const midX = lerp(CONFIG.START.x, hoop.tx, .55);
    obstacles.push({
      type: "spinner", x: clamp(midX, 150, 300), y: rand(340, 520),
      len: 72 + Math.min(extra * 5, 22),
      speed: (D.SPIN_SPEED + extra * D.SPIN_SPEED_PER_TIER) * (Math.random() < .5 ? -1 : 1),
      a: rand(0, TAU)
    });
    if (extra >= 1) {
      obstacles.push({
        type: "hand", x: clamp(midX + 70, 170, 330), y: rand(320, 470), r: 19,
        axis: Math.random() < .5 ? "y" : "x", range: 90,
        speed: D.HAND_SPEED + extra * D.HAND_SPEED_PER_TIER, phase: rand(0, TAU), ox: 0, oy: 0
      });
    }
  }
  // clamp so the hoop never slides off the right edge
  hoop.tx = clamp(hoop.tx, D.DIST_MIN, W - CONFIG.HOOP.RIM_HALF - CONFIG.HOOP.BOARD_GAP - CONFIG.HOOP.BOARD_W - 6 - hoop.slideAmp * .5);
}

/* ==================================================================
   9. HOOP UPDATE (movement + rim flex + cloth net)
   ================================================================== */
function updateHoop(dt) {
  const e = CONFIG.HOOP;
  // glide the base toward the target
  hoop.baseX = lerp(hoop.baseX, hoop.tx, 1 - Math.pow(.001, dt * (e.MOVE_EASE / 3.4)));
  hoop.baseY = lerp(hoop.baseY, hoop.ty, 1 - Math.pow(.001, dt * (e.MOVE_EASE / 3.4)));

  hoop.slidePhase += hoop.slideSpeed * dt;
  hoop.bobPhase += hoop.bobSpeed * dt;
  hoop.x = hoop.baseX + Math.sin(hoop.slidePhase) * hoop.slideAmp;
  hoop.y = hoop.baseY + Math.sin(hoop.bobPhase) * hoop.bobAmp;

  // rim flex: critically-ish damped spring back to rest
  hoop.flexV += (-e.FLEX_SPRING * hoop.flex - e.FLEX_DAMP * hoop.flexV) * dt;
  hoop.flex += hoop.flexV * dt;

  // net columns: spring back, get pushed by a ball inside the cylinder
  for (let i = 0; i < hoop.net.length; i++) {
    const n = hoop.net[i], v = hoop.netV[i];
    v.x += (-e.NET_SPRING * n.x - e.NET_DAMP * v.x * 2) * dt;
    v.y += (-e.NET_SPRING * n.y - e.NET_DAMP * v.y * 2) * dt;
    n.x += v.x * dt; n.y += v.y * dt;
  }
}
/* push the net when the ball is inside it */
function disturbNet(px, py, vx, vy) {
  const e = CONFIG.HOOP, step = (e.RIM_HALF * 2) / e.NET_COLS;
  for (let i = 0; i < hoop.net.length; i++) {
    const cx = hoop.x - e.RIM_HALF + i * step;
    const d = Math.abs(cx - px);
    if (d < 46) {
      const k = (1 - d / 46) * .05;
      hoop.netV[i].x += vx * k;
      hoop.netV[i].y += Math.abs(vy) * k * .8;
    }
  }
}

/* ==================================================================
   10. OBSTACLES
   ================================================================== */
function updateObstacles(dt) {
  for (const o of obstacles) {
    if (o.type === "spinner") o.a += o.speed * dt;
    else if (o.type === "hand") {
      o.phase += (o.speed / Math.max(1, o.range)) * dt;
      const off = Math.sin(o.phase) * o.range;
      o.ox = o.axis === "x" ? off : 0;
      o.oy = o.axis === "y" ? off : 0;
    }
  }
}
/* closest point on a segment, used by the spinning bar collider */
function closestOnSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const L = dx * dx + dy * dy;
  let t = L === 0 ? 0 : ((px - ax) * dx + (py - ay) * dy) / L;
  t = clamp(t, 0, 1);
  return { x: ax + dx * t, y: ay + dy * t };
}

/* ==================================================================
   11. BALL PHYSICS
   Substepped so a 1200px/s ball cannot tunnel through a 9px board.
   ================================================================== */
function resetBall() {
  const st = (G.mode === "trick" && level) ? level.start : CONFIG.START;
  const m = equippedBall();
  ball.x = st.x; ball.y = st.y;
  ball.vx = ball.vy = ball.spin = 0;
  ball.r = CONFIG.PHYSICS.BALL_RADIUS * m.size;
  ball.live = false; ball.t = 0; ball.restT = 0; ball.rot = 0;
  ball.touchRim = ball.touchBoard = ball.touchFloor = ball.touchObs = false;
  ball.trail.length = 0;
  G.slowUsed = false; G.clutchArmed = false;
}

function shoot(vx, vy, spin) {
  const m = equippedBall();
  ball.vx = vx; ball.vy = vy; ball.spin = spin;
  ball.live = true; ball.t = 0;
  ball.launchX = ball.x; ball.launchY = ball.y;
  G.shots++; SAVE.stats.shots++;
  const p = clamp(Math.hypot(vx, vy) / CONFIG.AIM.MAX_SPEED, 0, 1);
  Sound.whoosh(p);
  haptic(8);
  // puff of dust off the shooting hand
  burst(ball.x, ball.y, 8, { c:["#ffffff","#22e6ff"], spMin:40, spMax:150, rMin:1.5, rMax:3, lifeMin:.2, lifeMax:.45, g:120 });
}

function stepBall(dt) {
  if (!ball.live) return;
  const PH = CONFIG.PHYSICS, m = equippedBall();
  ball.t += dt;

  const SUB = 4, h = dt / SUB;
  for (let s = 0; s < SUB; s++) {
    const px = ball.x, py = ball.y;

    // ---- forces
    ball.vy += PH.GRAVITY * m.grav * h;
    ball.vx += G.wind * h;
    ball.vy -= ball.spin * PH.MAGNUS * h;          // backspin gives a little lift
    const dragK = 1 - PH.AIR_DRAG * m.drag * h;
    ball.vx *= dragK; ball.vy *= dragK;
    ball.spin *= 1 - PH.SPIN_DECAY * h;

    // ---- integrate
    ball.x += ball.vx * h;
    ball.y += ball.vy * h;
    ball.rot += (ball.vx * h) / ball.r;

    collideWorld(px, py, m);
    checkScore(py);
    if (!ball.live) return;
  }

  // ---- trail
  ball.trail.push({ x: ball.x, y: ball.y });
  if (ball.trail.length > CONFIG.JUICE.TRAIL_LEN) ball.trail.shift();

  // ---- flaming ball / FIRE mode embers
  if (G.fire || SAVE.ball === "flaming") {
    if (Math.random() < .75) spawnP({
      x: ball.x + rand(-5, 5), y: ball.y + rand(-5, 5),
      vx: -ball.vx * .12 + rand(-30, 30), vy: -ball.vy * .12 + rand(-70, -10),
      r: rand(2.5, 6), life: rand(.24, .5), c: pick(["#ff7a18","#ffb020","#ff2e93","#ffe14d"]), g: -90
    });
  }

  // ---- shot is dead?
  const sp = Math.hypot(ball.vx, ball.vy);
  const onFloor = ball.y + ball.r >= CONFIG.WORLD.FLOOR_Y - 1;
  if (onFloor && sp < PH.SLEEP_SPEED) ball.restT += dt; else ball.restT = 0;
  if (ball.t > PH.SHOT_TIMEOUT || ball.restT > .3) miss();
}

function collideWorld(px, py, m) {
  const PH = CONFIG.PHYSICS, e = CONFIG.HOOP, r = ball.r;

  // --- side walls + ceiling
  if (ball.x < r) { ball.x = r; ball.vx = Math.abs(ball.vx) * CONFIG.WORLD.WALL_BOUNCE; }
  if (ball.x > W - r) { ball.x = W - r; ball.vx = -Math.abs(ball.vx) * CONFIG.WORLD.WALL_BOUNCE; }
  if (ball.y < r) { ball.y = r; ball.vy = Math.abs(ball.vy) * CONFIG.WORLD.WALL_BOUNCE; }

  // --- floor
  if (ball.y + r > CONFIG.WORLD.FLOOR_Y) {
    ball.y = CONFIG.WORLD.FLOOR_Y - r;
    if (ball.vy > 60) {
      const v = ball.vy;
      ball.vy = -ball.vy * PH.REST_FLOOR * m.bounce;
      ball.vx *= PH.FLOOR_FRICTION;
      if (!ball.touchFloor) ball.touchFloor = true;
      Sound.bounce(v);
      burst(ball.x, CONFIG.WORLD.FLOOR_Y, 5, { c:"#ffffff", dir:-Math.PI/2, spread:1.0, spMin:50, spMax:170, rMin:1.2, rMax:2.6, lifeMin:.18, lifeMax:.4, g:500 });
      if (v > 420) Shake.add(2);
    } else { ball.vy = 0; ball.vx *= .92; ball.touchFloor = true; }
  }

  // --- rim nubs (two little circles the ball can clatter off)
  const rimY = hoop.y + hoop.flex;
  for (const sx of [-1, 1]) {
    const nx = hoop.x + sx * e.RIM_HALF, ny = rimY;
    const dx = ball.x - nx, dy = ball.y - ny, d = Math.hypot(dx, dy), min = r + e.NUB_R;
    if (d < min && d > 0.0001) {
      const nX = dx / d, nY = dy / d;
      ball.x = nx + nX * min; ball.y = ny + nY * min;
      const vn = ball.vx * nX + ball.vy * nY;
      if (vn < 0) {
        const k = PH.REST_RIM * m.bounce;
        ball.vx -= (1 + k) * vn * nX;
        ball.vy -= (1 + k) * vn * nY;
        ball.touchRim = true;
        hoop.flexV += clamp(-vn * .07, 0, 9);          // rim droops on impact
        Sound.clank(); haptic(12); Shake.add(3);
        burst(nx, ny, CONFIG.JUICE.SPARKS, { c:["#ffb020","#ffffff","#ff2e93"], spMin:60, spMax:260, rMin:1.2, rMax:3, lifeMin:.18, lifeMax:.42, g:420, shape:"spark" });
      }
    }
  }

  // --- backboard
  const bx = hoop.x + e.RIM_HALF + e.BOARD_GAP, by = rimY - e.BOARD_RISE;
  if (rectHit(bx, by, e.BOARD_W, e.BOARD_H, PH.REST_BOARD * m.bounce)) {
    if (!ball.touchBoard) { ball.touchBoard = true; }
    Sound.board(); haptic(10); Shake.add(2.5);
    burst(ball.x, ball.y, 6, { c:["#22e6ff","#ffffff"], spMin:40, spMax:160, rMin:1.4, rMax:3, lifeMin:.16, lifeMax:.38, g:260 });
  }

  // --- static level walls
  for (const w of walls) {
    if (rectHit(w.x, w.y, w.w, w.h, PH.REST_OBSTACLE * m.bounce)) {
      ball.touchObs = true;
      Sound.board(); Shake.add(2);
      burst(ball.x, ball.y, 6, { c:["#b6ff3a","#ffffff"], spMin:50, spMax:190, rMin:1.3, rMax:3, lifeMin:.16, lifeMax:.4, g:300 });
    }
  }

  // --- moving obstacles
  for (const o of obstacles) {
    if (o.type === "spinner") {
      const ax = o.x + Math.cos(o.a) * o.len, ay = o.y + Math.sin(o.a) * o.len;
      const bx2 = o.x - Math.cos(o.a) * o.len, by2 = o.y - Math.sin(o.a) * o.len;
      const c = closestOnSeg(ball.x, ball.y, ax, ay, bx2, by2);
      const dx = ball.x - c.x, dy = ball.y - c.y, d = Math.hypot(dx, dy), min = r + 7;
      if (d < min && d > .0001) {
        const nX = dx / d, nY = dy / d;
        ball.x = c.x + nX * min; ball.y = c.y + nY * min;
        const vn = ball.vx * nX + ball.vy * nY;
        if (vn < 0) {
          const k = PH.REST_OBSTACLE * m.bounce;
          ball.vx -= (1 + k) * vn * nX; ball.vy -= (1 + k) * vn * nY;
          // the bar slaps the ball along its tangential direction
          const rr = Math.hypot(c.x - o.x, c.y - o.y);
          ball.vx += -Math.sin(o.a) * o.speed * rr * .35;
          ball.vy += Math.cos(o.a) * o.speed * rr * .35;
          ball.touchObs = true;
          Sound.clank(); haptic(16); Shake.add(5);
          burst(c.x, c.y, 10, { c:["#ff2e93","#ffffff"], spMin:80, spMax:300, rMin:1.4, rMax:3.4, lifeMin:.2, lifeMax:.45, g:380, shape:"spark" });
        }
      }
    } else if (o.type === "hand") {
      const hx = o.x + o.ox, hy = o.y + o.oy;
      const dx = ball.x - hx, dy = ball.y - hy, d = Math.hypot(dx, dy), min = r + o.r;
      if (d < min && d > .0001) {
        const nX = dx / d, nY = dy / d;
        ball.x = hx + nX * min; ball.y = hy + nY * min;
        const vn = ball.vx * nX + ball.vy * nY;
        if (vn < 0) {
          const k = PH.REST_OBSTACLE * m.bounce;
          ball.vx -= (1 + k) * vn * nX; ball.vy -= (1 + k) * vn * nY;
          ball.touchObs = true;
          Sound.board(); haptic(20); Shake.add(6);
          burst(hx, hy, 9, { c:["#ffb020","#ffffff"], spMin:70, spMax:250, rMin:1.5, rMax:3.2, lifeMin:.2, lifeMax:.45, g:340 });
        }
      }
    }
  }

  // --- net interaction
  if (Math.abs(ball.x - hoop.x) < e.RIM_HALF + 14 && ball.y > rimY - 6 && ball.y < rimY + e.NET_LEN + 12) {
    disturbNet(ball.x, ball.y, ball.vx, ball.vy);
  }
}

/* circle-vs-axis-aligned-rect, resolved along the shallowest axis */
function rectHit(rx, ry, rw, rh, rest) {
  const r = ball.r;
  const cx = clamp(ball.x, rx, rx + rw), cy = clamp(ball.y, ry, ry + rh);
  const dx = ball.x - cx, dy = ball.y - cy;
  const d2 = dx * dx + dy * dy;
  if (d2 > r * r) return false;
  let nX, nY;
  if (d2 > .0001) { const d = Math.sqrt(d2); nX = dx / d; nY = dy / d; ball.x = cx + nX * r; ball.y = cy + nY * r; }
  else {
    // centre is inside the rect: eject along the nearest face
    const left = ball.x - rx, right = rx + rw - ball.x, top = ball.y - ry, bot = ry + rh - ball.y;
    const mn = Math.min(left, right, top, bot);
    if (mn === left)      { nX = -1; nY = 0; ball.x = rx - r; }
    else if (mn === right){ nX = 1;  nY = 0; ball.x = rx + rw + r; }
    else if (mn === top)  { nX = 0;  nY = -1; ball.y = ry - r; }
    else                  { nX = 0;  nY = 1;  ball.y = ry + rh + r; }
  }
  const vn = ball.vx * nX + ball.vy * nY;
  if (vn < 0) { ball.vx -= (1 + rest) * vn * nX; ball.vy -= (1 + rest) * vn * nY; return true; }
  return false;
}

/* ==================================================================
   12. SCORING, COMBO, FIRE MODE
   ================================================================== */
function comboMult() {
  const C = CONFIG.SCORING;
  if (G.combo >= C.FIRE_AT) return C.FIRE_MULT;
  return C.COMBO_STEPS[Math.min(G.combo, C.COMBO_STEPS.length - 1)];
}

/* Did the ball just fall through the rim plane, moving down, inside it? */
function checkScore(py0) {
  if (!ball.live || ball.vy <= 0) return;
  const e = CONFIG.HOOP, rimY = hoop.y + hoop.flex;
  if (py0 < rimY && ball.y >= rimY && Math.abs(ball.x - hoop.x) < e.RIM_HALF - 4) basket();
}

function basket() {
  const C = CONFIG.SCORING, J = CONFIG.JUICE, K = CONFIG.COINS;
  ball.live = false;

  const swish = !ball.touchRim && !ball.touchBoard && !ball.touchObs;
  const bank = ball.touchBoard && !ball.touchRim;
  const flightDist = dist(ball.launchX, ball.launchY, hoop.x, hoop.y);
  const long = flightDist >= C.LONG_MIN_DIST;

  // ---- trick-shot levels enforce their own requirement --------------
  if (G.mode === "trick" && level && level.need) {
    const ok = level.need === "bank"  ? ball.touchBoard
             : level.need === "floor" ? ball.touchFloor
             : level.need === "swish" ? swish
             : true;
    if (!ok) {
      const why = level.need === "bank" ? "NO BANK!" : level.need === "floor" ? "NO BOUNCE!" : "NOT CLEAN!";
      pop(hoop.x, hoop.y - 34, why, "#ff2e93", true);
      Sound.fail(); haptic(J.HAPTIC_MISS);
      failAttempt();
      return;
    }
  }

  // ---- combo ladder --------------------------------------------------
  const wasFire = G.fire;
  if (swish) {
    G.combo++;
    G.swishes++; SAVE.stats.swishes++;
  } else {
    G.combo = 0;
  }
  G.mult = comboMult();
  G.fire = G.combo >= C.FIRE_AT;
  G.bestCombo = Math.max(G.bestCombo, G.combo);
  if (G.fire && !wasFire) {
    G.everFire = true;
    Sound.fire(); flash(.42); Shake.add(J.SHAKE_FIRE);
    haptic([20, 40, 20, 40, 60]);
    pop(W / 2, 250, "FIRE MODE!", "#ff2e93", true);
    burst(ball.x, ball.y, 34, { c:["#ff7a18","#ffb020","#ff2e93","#ffe14d"], spMin:120, spMax:420, rMin:2, rMax:6, lifeMin:.4, lifeMax:.9, g:-60 });
  }

  // ---- points --------------------------------------------------------
  let pts = C.BASKET;
  const labels = [];
  if (swish) { pts += C.SWISH_BONUS; labels.push("SWISH"); }
  if (bank) { pts += C.BANK_BONUS; labels.push("BANK"); G.bankShots++; SAVE.stats.bankShots++; }
  if (long) { pts += C.LONG_BONUS; labels.push("DOWNTOWN"); G.longShots++; SAVE.stats.longShots++; }
  if (ball.touchFloor) { pts += C.FLOOR_BOUNCE_BONUS; labels.push("BOUNCE"); }
  if (obstacles.length) { pts += C.OBSTACLE_BONUS; G.obstacleBaskets++; SAVE.stats.obstacleBaskets++; }
  pts = Math.round(pts * G.mult);

  G.score += pts;
  G.baskets++; SAVE.stats.baskets++;

  // ---- coins ---------------------------------------------------------
  let coins = K.PER_BASKET;
  if (swish) coins += K.PER_SWISH;
  if (long) coins += K.PER_LONG;
  if (G.fire) coins += K.PER_FIRE_BASKET;
  G.coinsRun += coins;
  SAVE.coins += coins; SAVE.stats.coinsEarned += coins;

  // ---- juice ---------------------------------------------------------
  const label = labels.length ? labels[0] : "";
  pop(hoop.x, hoop.y - 26, "+" + pts + (label ? " " + label : ""), swish ? "#b6ff3a" : "#22e6ff", swish || G.fire);
  if (G.mult > 1) pop(hoop.x, hoop.y - 58, "x" + G.mult, G.fire ? "#ff2e93" : "#ffb020");
  pop(hoop.x + 44, hoop.y - 6, "+" + coins, "#ffb020");

  Shake.add(swish ? J.SHAKE_SWISH : J.SHAKE_BASKET);
  haptic(swish ? J.HAPTIC_SWISH : J.HAPTIC_BASKET);
  Sound.swish(); Sound.coin();
  if (swish || G.fire) { Sound.cheer(); confetti(hoop.x, hoop.y + 12); flash(swish ? .22 : .14); }

  burst(hoop.x, hoop.y + 16, J.SWISH_BURST, {
    c: G.fire ? ["#ff7a18","#ffb020","#ff2e93"] : ["#22e6ff","#ffffff","#b6ff3a"],
    dir: Math.PI / 2, spread: 1.1, spMin: 90, spMax: 340, rMin: 1.6, rMax: 4.4,
    lifeMin: .3, lifeMax: .75, g: 520
  });
  // the net snaps as it passes through
  for (let i = 0; i < hoop.netV.length; i++) hoop.netV[i].y += rand(120, 260);
  hoop.flexV += 3.4;

  bumpScoreUI();
  checkAchievements();

  // ---- what happens next ---------------------------------------------
  if (G.mode === "trick") { levelCleared(); return; }
  G.resetT = .42;
  G.state = S.RESET;
}

function failAttempt() {
  // a trick-shot attempt that went in but broke the rule
  ball.live = false;
  G.combo = 0; G.mult = 1; G.fire = false;
  G.lives--;
  updateLivesUI();
  if (G.lives <= 0) { endRun("failed"); return; }
  G.resetT = .5; G.state = S.RESET;
}

function miss() {
  if (!ball.live) return;
  ball.live = false;
  const J = CONFIG.JUICE;
  G.combo = 0; G.mult = 1;
  const wasFire = G.fire; G.fire = false;
  Shake.add(J.SHAKE_MISS);
  haptic(J.HAPTIC_MISS);
  Sound.fail();
  if (wasFire) pop(ball.x, ball.y - 24, "FIRE OUT", "#8a8fb5");

  if (G.mode === "endless") { pop(W / 2, 300, "MISS", "#ff2e93", true); endRun("miss"); return; }
  if (G.mode === "trick") {
    G.lives--; updateLivesUI();
    pop(ball.x, ball.y - 24, "MISS", "#ff2e93");
    if (G.lives <= 0) { endRun("failed"); return; }
  } else {
    pop(ball.x, ball.y - 24, "MISS", "#ff2e93");
  }
  G.resetT = .45; G.state = S.RESET;
}

/* ==================================================================
   13. RUN LIFECYCLE
   ================================================================== */
function startRun(mode, levelIdx) {
  G.mode = mode;
  G.state = S.AIM;
  G.score = 0; G.baskets = 0; G.swishes = 0; G.shots = 0; G.coinsRun = 0;
  G.combo = 0; G.mult = 1; G.fire = false; G.everFire = false;
  G.bestCombo = 0; G.longShots = 0; G.bankShots = 0; G.obstacleBaskets = 0;
  G.tier = 0; G.elapsed = 0; G.newBest = false;
  G.timeScale = 1; G.slowT = 0; G.resetT = 0;
  G.wind = G.windTarget = 0;
  P.length = 0; POPS.length = 0;
  obstacles = []; walls = []; level = null;

  const md = CONFIG.MODES[mode];
  G.maxLives = md.lives; G.lives = md.lives;
  G.timeLeft = md.time;

  if (mode === "trick") {
    G.level = levelIdx | 0;
    level = LEVELS[G.level];
    hoop.tx = hoop.baseX = hoop.x = level.hoop.x;
    hoop.ty = hoop.baseY = hoop.y = level.hoop.y;
    hoop.slideAmp = hoop.bobAmp = 0;
    walls = level.walls.map(w => ({ ...w }));
    obstacles = level.obs.map(o => ({ ...o, a: o.phase || 0, ox: 0, oy: 0 }));
    $("objective").textContent = (G.level + 1) + ". " + level.n + " — " + level.hint;
  } else {
    hoop.baseX = hoop.x = hoop.tx = 300;
    hoop.baseY = hoop.y = hoop.ty = 400;
    applyDifficulty();
    $("objective").textContent = "";
  }

  SAVE.stats.plays++;
  resetBall();
  updateLivesUI(); updateHUD(); showHUD(true);
  showScreen(null);
  coachHint();
  save();
}

function levelCleared() {
  const first = !SAVE.levels.includes(G.level);
  if (first) { SAVE.levels.push(G.level); SAVE.coins += CONFIG.COINS.LEVEL_CLEAR; G.coinsRun += CONFIG.COINS.LEVEL_CLEAR; }
  Sound.levelUp(); confetti(W / 2, 300); flash(.3);
  pop(W / 2, 250, first ? "LEVEL CLEAR +" + CONFIG.COINS.LEVEL_CLEAR : "CLEARED AGAIN", "#b6ff3a", true);
  SAVE.best.trick = SAVE.levels.length;
  checkAchievements();
  saveNow();
  setTimeout(() => endRun("cleared"), 1100);
}

function endRun(reason) {
  G.state = S.OVER;
  G.timeScale = 1;
  showHUD(false);

  // best score + local leaderboard (trick mode scores levels cleared instead)
  if (G.mode !== "trick") {
    if (G.score > (SAVE.best[G.mode] || 0)) { SAVE.best[G.mode] = G.score; G.newBest = true; }
    if (G.score > 0) {
      SAVE.scores.push({ name: SAVE.name || "YOU", score: G.score, mode: G.mode, date: Date.now() });
      SAVE.scores.sort((a, b) => b.score - a.score);
      SAVE.scores = SAVE.scores.slice(0, 10);
    }
  }
  SAVE.stats.bestCombo = Math.max(SAVE.stats.bestCombo, G.bestCombo);
  checkAchievements();
  saveNow();
  showScreen("scOver");   // screen first: the celebration animation only runs while it is up
  buildGameOver(reason);
}

/* clutch slow-motion: the last heartbeat before a shot that matters */
function isClutch() {
  if (G.mode === "time") return G.timeLeft <= 3.5;
  if (G.mode === "trick") return G.lives === 1;
  return SAVE.best.endless > 0 && G.score >= SAVE.best.endless - CONFIG.SCORING.BASKET * 3;
}
function maybeSlowmo() {
  if (G.slowUsed || !ball.live || ball.vy <= 0) return;
  if (!isClutch()) return;
  if (dist(ball.x, ball.y, hoop.x, hoop.y) < CONFIG.JUICE.SLOWMO_TRIGGER_DIST) {
    G.slowUsed = true;
    G.slowT = CONFIG.JUICE.SLOWMO_TIME;
    flash(.1);
  }
}

/* ==================================================================
   14. ACHIEVEMENTS + DAILY STREAK
   ================================================================== */
function checkAchievements() {
  const run = {
    mode: G.mode, score: G.score, baskets: G.baskets, swishes: G.swishes,
    everFire: G.everFire, longShots: G.longShots, combo: G.bestCombo
  };
  for (const a of ACHIEVEMENTS) {
    if (SAVE.ach.includes(a.id)) continue;
    let ok = false;
    try { ok = a.test(run, SAVE); } catch (e) { ok = false; }
    if (ok) {
      SAVE.ach.push(a.id);
      toast(a.ic, a.name, a.desc);
      Sound.levelUp();
      haptic([12, 30, 12]);
      save();
    }
  }
}

function toast(ic, title, sub) {
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = '<span class="ic"></span><span><span class="tt"></span><span class="ts"></span></span>';
  el.querySelector(".ic").textContent = ic;
  el.querySelector(".tt").textContent = title;
  el.querySelector(".ts").textContent = sub;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

const todayKey = () => new Date().toISOString().slice(0, 10);
function dayDiff(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

function checkDailyStreak() {
  const t = todayKey(), last = SAVE.streak.last;
  if (last === t) return null;                      // already counted today
  if (!last) SAVE.streak.days = 1;
  else {
    const d = dayDiff(last, t);
    SAVE.streak.days = d === 1 ? SAVE.streak.days + 1 : 1;
  }
  SAVE.streak.last = t;
  const reward = Math.min(
    CONFIG.COINS.STREAK_BASE + (SAVE.streak.days - 1) * CONFIG.COINS.STREAK_PER_DAY,
    CONFIG.COINS.STREAK_CAP
  );
  SAVE.coins += reward;
  SAVE.stats.coinsEarned += reward;
  saveNow();
  return { days: SAVE.streak.days, reward };
}

/* ==================================================================
   15. RENDERING
   The court backdrop is static per skin, so it is painted once into an
   offscreen canvas and blitted. Only the live stuff is redrawn.
   ================================================================== */
let bgDirty = true, bgCanvas = document.createElement("canvas"), bgCtx = bgCanvas.getContext("2d");

function paintBackdrop() {
  const c = equippedCourt();
  bgCanvas.width = Math.max(1, Math.round(W * DPR));
  bgCanvas.height = Math.max(1, Math.round(H * DPR));
  const g = bgCtx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.clearRect(0, 0, W, H);

  // sky / wall gradient
  const sky = g.createLinearGradient(0, 0, 0, CONFIG.WORLD.FLOOR_Y);
  sky.addColorStop(0, c.sky[0]); sky.addColorStop(1, c.sky[1]);
  g.fillStyle = sky; g.fillRect(0, 0, W, CONFIG.WORLD.FLOOR_Y);

  // big soft glow behind the rim area
  const glow = g.createRadialGradient(W * .72, 330, 10, W * .72, 330, 340);
  glow.addColorStop(0, hexA(c.glow, .15)); glow.addColorStop(1, hexA(c.glow, 0));
  g.fillStyle = glow; g.fillRect(0, 0, W, CONFIG.WORLD.FLOOR_Y);

  g.save();
  g.globalAlpha = .55;
  if (c.back === "fence") {
    // chain-link diagonals
    g.strokeStyle = hexA(c.line, .5); g.lineWidth = 1;
    for (let i = -H; i < W + H; i += 26) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i + H, H); g.stroke();
      g.beginPath(); g.moveTo(i + H, 0); g.lineTo(i, H); g.stroke();
    }
    // lamp
    g.fillStyle = hexA(c.accent, .5); g.fillRect(58, 0, 7, 92);
    g.beginPath(); g.ellipse(61, 96, 26, 13, 0, 0, TAU); g.fill();
  } else if (c.back === "crowd") {
    for (let row = 0; row < 7; row++) {
      const y = 60 + row * 34, a = .1 + row * .045;
      g.fillStyle = hexA(row % 2 ? c.glow : c.accent, a);
      for (let x = 12; x < W; x += 30) {
        g.beginPath(); g.arc(x + (row % 2) * 15, y, 10 - row * .5, 0, TAU); g.fill();
      }
    }
  } else if (c.back === "skyline") {
    g.fillStyle = hexA("#ffe14d", .35);
    g.beginPath(); g.arc(W * .68, 250, 86, 0, TAU); g.fill();
    g.fillStyle = hexA("#1a0a26", .85);
    let x = -10;
    while (x < W + 20) {
      const bw = rand(34, 62), bh = rand(120, 320);
      g.fillRect(x, CONFIG.WORLD.FLOOR_Y - bh, bw, bh);
      g.fillStyle = hexA("#ffb020", .18);
      for (let wy = CONFIG.WORLD.FLOOR_Y - bh + 14; wy < CONFIG.WORLD.FLOOR_Y - 20; wy += 22)
        for (let wx = x + 7; wx < x + bw - 9; wx += 15)
          if (Math.random() < .45) g.fillRect(wx, wy, 6, 9);
      g.fillStyle = hexA("#1a0a26", .85);
      x += bw + rand(6, 16);
    }
  } else {
    // arcade: perspective grid + scanlines
    g.strokeStyle = hexA(c.line, .8); g.lineWidth = 1.2;
    for (let i = 0; i <= 12; i++) {
      const x = (i / 12) * W;
      g.beginPath(); g.moveTo(x, CONFIG.WORLD.FLOOR_Y); g.lineTo(lerp(W / 2, x, 2.4), 210); g.stroke();
    }
    for (let i = 1; i < 9; i++) {
      const y = 210 + Math.pow(i / 9, 2.1) * (CONFIG.WORLD.FLOOR_Y - 210);
      g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    }
    g.globalAlpha = .12; g.fillStyle = c.glow;
    for (let y = 0; y < H; y += 4) g.fillRect(0, y, W, 1);
  }
  g.restore();

  // floor
  const fl = g.createLinearGradient(0, CONFIG.WORLD.FLOOR_Y, 0, H);
  fl.addColorStop(0, c.floor); fl.addColorStop(1, "#05050c");
  g.fillStyle = fl; g.fillRect(0, CONFIG.WORLD.FLOOR_Y, W, H - CONFIG.WORLD.FLOOR_Y);
  g.strokeStyle = hexA(c.glow, .75); g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(0, CONFIG.WORLD.FLOOR_Y); g.lineTo(W, CONFIG.WORLD.FLOOR_Y); g.stroke();
  // court markings
  g.strokeStyle = hexA(c.line, .9); g.lineWidth = 2;
  g.beginPath(); g.ellipse(W * .5, H - 20, 150, 34, 0, Math.PI, TAU); g.stroke();
  g.beginPath(); g.moveTo(W * .18, CONFIG.WORLD.FLOOR_Y + 22); g.lineTo(W * .82, CONFIG.WORLD.FLOOR_Y + 22); g.stroke();

  bgDirty = false;
}
/* "#rrggbb" + alpha -> rgba() */
function hexA(hex, a) {
  const h = hex.replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map(x => x + x).join("") : h, 16);
  return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
}

/* ---------- hoop: pole, backboard, rim, cloth net ---------------- */
function drawHoop() {
  const e = CONFIG.HOOP, c = equippedCourt();
  const rimY = hoop.y + hoop.flex;
  const bx = hoop.x + e.RIM_HALF + e.BOARD_GAP;
  const boardTop = rimY - e.BOARD_RISE;

  // support arm out to the right edge
  ctx.strokeStyle = "#2a2a44"; ctx.lineWidth = 9; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(bx + e.BOARD_W, boardTop + e.BOARD_H * .42);
  ctx.lineTo(W + 10, boardTop + e.BOARD_H * .42 - 16);
  ctx.stroke();

  // backboard
  ctx.fillStyle = hexA(c.glow, .13);
  roundRect(bx, boardTop, e.BOARD_W, e.BOARD_H, 3); ctx.fill();
  ctx.strokeStyle = hexA(c.glow, .85); ctx.lineWidth = 2.4;
  roundRect(bx, boardTop, e.BOARD_W, e.BOARD_H, 3); ctx.stroke();
  // the inner square target, drawn as a thin bracket on the board face
  ctx.strokeStyle = hexA("#ffffff", .5); ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(bx - 1, rimY - 44); ctx.lineTo(bx - 1, rimY - 6);
  ctx.stroke();

  drawNet(rimY);

  // rim: a thick bar with two bright nubs
  const grd = ctx.createLinearGradient(hoop.x - e.RIM_HALF, rimY, hoop.x + e.RIM_HALF, rimY);
  grd.addColorStop(0, "#ff6a2b"); grd.addColorStop(.5, "#ff2e93"); grd.addColorStop(1, "#ff6a2b");
  ctx.strokeStyle = grd; ctx.lineWidth = 6.5; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(hoop.x - e.RIM_HALF, rimY);
  ctx.quadraticCurveTo(hoop.x, rimY + hoop.flex * .8 + 3, hoop.x + e.RIM_HALF, rimY);
  ctx.stroke();
  ctx.shadowColor = "#ff2e93"; ctx.shadowBlur = 16;
  ctx.strokeStyle = hexA("#ff2e93", .6); ctx.lineWidth = 2.5; ctx.stroke();
  ctx.shadowBlur = 0;
  for (const s of [-1, 1]) {
    ctx.fillStyle = "#ffd9a0";
    ctx.beginPath(); ctx.arc(hoop.x + s * e.RIM_HALF, rimY, e.NUB_R, 0, TAU); ctx.fill();
  }
}

function drawNet(rimY) {
  const e = CONFIG.HOOP, cols = e.NET_COLS, rows = e.NET_ROWS;
  const topHalf = e.RIM_HALF, botHalf = e.RIM_HALF * .58;
  const pt = (i, j) => {
    const t = j / rows;
    const half = lerp(topHalf, botHalf, t);
    const d = hoop.net[i] || { x: 0, y: 0 };
    return {
      x: hoop.x - half + (i / cols) * half * 2 + d.x * t,
      y: rimY + e.NET_LEN * t + d.y * t * .5
    };
  };
  ctx.strokeStyle = "rgba(255,255,255,.42)";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  // diagonal mesh both ways = classic net look
  for (let i = 0; i <= cols; i++) {
    for (let j = 0; j < rows; j++) {
      const a = pt(i, j);
      if (i < cols) { const b = pt(i + 1, j + 1); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
      if (i > 0) { const b2 = pt(i - 1, j + 1); ctx.moveTo(a.x, a.y); ctx.lineTo(b2.x, b2.y); }
    }
  }
  ctx.stroke();
  // bottom hem
  ctx.strokeStyle = "rgba(255,255,255,.62)"; ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (let i = 0; i <= cols; i++) { const p = pt(i, rows); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
  ctx.stroke();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------- ball ------------------------------------------------- */
function drawBallAt(g, x, y, r, rot, def, onFire) {
  g.save(); g.translate(x, y); g.rotate(rot);
  const grd = g.createRadialGradient(-r * .3, -r * .35, r * .15, 0, 0, r);
  grd.addColorStop(0, def.c1); grd.addColorStop(1, def.c2);
  g.fillStyle = grd;
  g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();

  g.strokeStyle = def.line; g.lineWidth = Math.max(1.1, r * .09);
  if (def.style === "lines" || def.style === "ember") {
    g.beginPath(); g.moveTo(-r, 0); g.lineTo(r, 0); g.stroke();
    g.beginPath(); g.moveTo(0, -r); g.lineTo(0, r); g.stroke();
    g.beginPath(); g.ellipse(0, 0, r * .52, r, 0, 0, TAU); g.stroke();
  } else if (def.style === "veins") {
    g.globalAlpha = .55;
    for (let i = 0; i < 3; i++) {
      g.beginPath();
      g.moveTo(-r, -r * .5 + i * r * .5);
      g.quadraticCurveTo(0, -r * .2 + i * r * .55, r, -r * .6 + i * r * .55);
      g.stroke();
    }
    g.globalAlpha = 1;
  } else if (def.style === "glow") {
    g.shadowColor = def.c1; g.shadowBlur = r * 1.1;
    g.beginPath(); g.arc(0, 0, r * .72, 0, TAU); g.stroke();
    g.shadowBlur = 0;
    g.beginPath(); g.moveTo(-r, 0); g.lineTo(r, 0); g.stroke();
  } else if (def.style === "ring") {
    g.globalAlpha = .9;
    g.beginPath(); g.ellipse(0, 0, r * 1.45, r * .34, -.4, 0, TAU); g.stroke();
    g.globalAlpha = 1;
    g.beginPath(); g.arc(r * .25, -r * .2, r * .26, 0, TAU); g.fillStyle = hexA("#ffffff", .25); g.fill();
  } else if (def.style === "panels") {
    const cols = ["#ff2e93", "#ffe14d", "#22e6ff", "#ffffff", "#b6ff3a", "#ff8c2b"];
    for (let i = 0; i < 6; i++) {
      g.fillStyle = cols[i];
      g.beginPath(); g.moveTo(0, 0);
      g.arc(0, 0, r, (i / 6) * TAU, ((i + 1) / 6) * TAU); g.closePath(); g.fill();
    }
    g.strokeStyle = "#ffffff"; g.lineWidth = r * .07;
    g.beginPath(); g.arc(0, 0, r, 0, TAU); g.stroke();
  }
  // specular highlight
  g.globalAlpha = .28; g.fillStyle = "#fff";
  g.beginPath(); g.ellipse(-r * .34, -r * .4, r * .3, r * .2, -.6, 0, TAU); g.fill();
  g.globalAlpha = 1;
  g.restore();

  if (onFire) {
    g.save();
    g.globalCompositeOperation = "lighter";
    const fg = g.createRadialGradient(x, y, r * .4, x, y, r * 2.1);
    fg.addColorStop(0, "rgba(255,180,40,.55)");
    fg.addColorStop(.5, "rgba(255,80,20,.22)");
    fg.addColorStop(1, "rgba(255,40,10,0)");
    g.fillStyle = fg;
    g.beginPath(); g.arc(x, y, r * 2.1, 0, TAU); g.fill();
    g.restore();
  }
}

function drawBall() {
  const def = equippedBall();
  const onFire = G.fire || def.id === "flaming";
  // trail
  if (ball.trail.length > 1) {
    ctx.save();
    for (let i = 0; i < ball.trail.length; i++) {
      const t = i / ball.trail.length;
      ctx.globalAlpha = t * .38 * CONFIG.JUICE.TRAIL_FADE;
      ctx.fillStyle = onFire ? "#ff7a18" : def.trail;
      ctx.beginPath(); ctx.arc(ball.trail[i].x, ball.trail[i].y, ball.r * (.25 + t * .72), 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
  // contact shadow on the floor
  const sy = CONFIG.WORLD.FLOOR_Y;
  const k = clamp(1 - (sy - ball.y) / 420, .06, .5);
  ctx.globalAlpha = k * .5; ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.ellipse(ball.x, sy + 4, ball.r * (.5 + k), ball.r * .32, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;

  drawBallAt(ctx, ball.x, ball.y, ball.r, ball.rot, def, onFire);
}

/* ---------- obstacles + walls ------------------------------------ */
function drawObstacles() {
  for (const w of walls) {
    ctx.fillStyle = "rgba(182,255,58,.14)";
    roundRect(w.x, w.y, w.w, w.h, 5); ctx.fill();
    ctx.strokeStyle = "#b6ff3a"; ctx.lineWidth = 2.2;
    roundRect(w.x, w.y, w.w, w.h, 5); ctx.stroke();
  }
  for (const o of obstacles) {
    if (o.type === "spinner") {
      const ax = o.x + Math.cos(o.a) * o.len, ay = o.y + Math.sin(o.a) * o.len;
      const bx = o.x - Math.cos(o.a) * o.len, by = o.y - Math.sin(o.a) * o.len;
      ctx.strokeStyle = "rgba(255,46,147,.25)"; ctx.lineWidth = 18; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      ctx.strokeStyle = "#ff2e93"; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
      ctx.fillStyle = "#12121f"; ctx.strokeStyle = "#ff8fc4"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(o.x, o.y, 7, 0, TAU); ctx.fill(); ctx.stroke();
    } else {
      const hx = o.x + o.ox, hy = o.y + o.oy;
      // a defender's hand: palm + four fingers, reaching up
      ctx.save(); ctx.translate(hx, hy);
      ctx.fillStyle = "rgba(255,176,32,.2)";
      ctx.beginPath(); ctx.arc(0, 0, o.r + 7, 0, TAU); ctx.fill();
      ctx.fillStyle = CONFIG.PLAYER.SKIN;
      ctx.beginPath(); ctx.arc(0, 2, o.r * .82, 0, TAU); ctx.fill();
      for (let i = 0; i < 4; i++) {
        const a = -Math.PI / 2 + (i - 1.5) * .34;
        ctx.save(); ctx.rotate(a);
        ctx.fillStyle = CONFIG.PLAYER.SKIN;
        roundRect(-3.4, -o.r * 1.5, 6.8, o.r * .95, 3.4); ctx.fill();
        ctx.restore();
      }
      ctx.strokeStyle = hexA("#ffb020", .8); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, o.r + 7, 0, TAU); ctx.stroke();
      ctx.restore();
    }
  }
}

/* ---------- the player: HEN, #7, purple ------------------------- */
function drawPlayer(g, x, y, s, pose, t) {
  const P0 = CONFIG.PLAYER;
  const crouch = pose === "aim" ? 7 : 0;
  const jump = pose === "celebrate" ? Math.abs(Math.sin(t * 3.2)) * 13 : 0;
  const bob = pose === "idle" ? Math.sin(t * 2.1) * 1.8 : 0;
  g.save();
  g.translate(x, y - jump + bob);
  g.scale(s, s);

  // ground shadow
  g.globalAlpha = .34; g.fillStyle = "#000";
  g.beginPath(); g.ellipse(0, 4 + jump * .4, 24 - jump * .3, 6.5, 0, 0, TAU); g.fill();
  g.globalAlpha = 1;

  const hipY = -52 + crouch, headY = -100 + crouch;

  // legs
  g.strokeStyle = "#2b2b46"; g.lineWidth = 11; g.lineCap = "round";
  const spread = pose === "celebrate" ? 15 : 10;
  g.beginPath(); g.moveTo(-5, hipY + 6); g.lineTo(-spread, -6 - jump * .2); g.stroke();
  g.beginPath(); g.moveTo(5, hipY + 6); g.lineTo(spread, -6 - jump * .2); g.stroke();
  // shoes
  g.fillStyle = P0.SHOE;
  g.beginPath(); g.ellipse(-spread - 2, -3, 8, 4.5, 0, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(spread + 2, -3, 8, 4.5, 0, 0, TAU); g.fill();

  // shorts
  g.fillStyle = P0.JERSEY_DARK;
  rr(g, -13, hipY - 4, 26, 20, 6); g.fill();

  // jersey
  g.fillStyle = P0.JERSEY;
  rr(g, -14, hipY - 34, 28, 33, 8); g.fill();
  g.fillStyle = "rgba(255,255,255,.9)";
  g.font = '900 15px ' + FONT; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(P0.NUMBER, 0, hipY - 17);

  // arms
  g.strokeStyle = P0.SKIN; g.lineWidth = 8;
  if (pose === "celebrate") {
    g.beginPath(); g.moveTo(-11, hipY - 28); g.lineTo(-27, headY - 14); g.stroke();
    g.beginPath(); g.moveTo(11, hipY - 28); g.lineTo(27, headY - 14); g.stroke();
  } else if (pose === "shoot") {
    g.beginPath(); g.moveTo(-11, hipY - 28); g.lineTo(-19, headY - 6); g.stroke();
    g.beginPath(); g.moveTo(11, hipY - 28); g.lineTo(16, headY - 12); g.stroke();
  } else if (pose === "aim") {
    g.beginPath(); g.moveTo(-11, hipY - 26); g.lineTo(-20, hipY - 44); g.stroke();
    g.beginPath(); g.moveTo(11, hipY - 26); g.lineTo(18, hipY - 42); g.stroke();
  } else {
    g.beginPath(); g.moveTo(-11, hipY - 26); g.lineTo(-17, hipY - 6); g.stroke();
    g.beginPath(); g.moveTo(11, hipY - 26); g.lineTo(17, hipY - 6); g.stroke();
  }

  // head + headband
  g.fillStyle = P0.SKIN;
  g.beginPath(); g.arc(0, headY, 13, 0, TAU); g.fill();
  g.fillStyle = "#14142a";
  g.beginPath(); g.arc(0, headY - 3, 13, Math.PI * 1.08, Math.PI * 1.92); g.fill();
  g.fillStyle = P0.JERSEY;
  rr(g, -13, headY - 6, 26, 5, 2.5); g.fill();
  // face
  g.fillStyle = "#1b1b2e";
  g.beginPath(); g.arc(-4.5, headY + 1, 1.7, 0, TAU); g.fill();
  g.beginPath(); g.arc(4.5, headY + 1, 1.7, 0, TAU); g.fill();
  g.strokeStyle = "#1b1b2e"; g.lineWidth = 1.6; g.lineCap = "round";
  g.beginPath();
  if (pose === "celebrate") g.arc(0, headY + 4, 5, .15 * Math.PI, .85 * Math.PI);
  else g.arc(0, headY + 5, 3.4, .1 * Math.PI, .9 * Math.PI);
  g.stroke();
  g.restore();
}
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

/* ==================================================================
   16. AIM PREVIEW
   Simulated with the exact same forces as the live ball, so the dots
   never lie to you.
   ================================================================== */
const aim = { active: false, sx: 0, sy: 0, cx: 0, cy: 0 };

function aimVector() {
  const A = CONFIG.AIM;
  let dx = aim.sx - aim.cx, dy = aim.sy - aim.cy;      // pull back -> shoot forward
  let len = Math.hypot(dx, dy);
  if (len < .001) return { vx: 0, vy: 0, spin: 0, power: 0, len: 0 };
  const use = Math.min(len, A.MAX_DRAG);
  const speed = Math.min(use * A.POWER_PER_PX, A.MAX_SPEED);
  const ux = dx / len, uy = dy / len;
  return {
    vx: ux * speed, vy: uy * speed,
    spin: -(aim.cx - aim.sx) * CONFIG.PHYSICS.SPIN_PER_PX * .02,
    power: use / A.MAX_DRAG, len
  };
}

function simulateArc(vx, vy, spin) {
  const PH = CONFIG.PHYSICS, m = equippedBall(), A = CONFIG.AIM;
  let x = ball.x, y = ball.y, sx = vx, sy = vy, sp = spin;
  const pts = [];
  const SUB = 3, step = A.DOT_TIME_STEP / SUB;
  for (let i = 0; i < A.DOT_COUNT; i++) {
    for (let s = 0; s < SUB; s++) {
      sy += PH.GRAVITY * m.grav * step;
      sx += G.wind * step;
      sy -= sp * PH.MAGNUS * step;
      const k = 1 - PH.AIR_DRAG * m.drag * step;
      sx *= k; sy *= k; sp *= 1 - PH.SPIN_DECAY * step;
      x += sx * step; y += sy * step;
    }
    if (y > CONFIG.WORLD.FLOOR_Y - ball.r || x < 0 || x > W) { pts.push({ x, y }); break; }
    pts.push({ x, y });
  }
  return pts;
}

function drawAim() {
  if (!aim.active) return;
  const A = CONFIG.AIM, v = aimVector();
  if (v.len < A.MIN_DRAG) return;
  const pts = simulateArc(v.vx, v.vy, v.spin);
  const hot = G.fire ? "#ff2e93" : "#22e6ff";

  // dotted arc, fading and shrinking with distance
  for (let i = 0; i < pts.length; i++) {
    const t = i / pts.length;
    ctx.globalAlpha = (1 - t) * .9;
    ctx.fillStyle = i < 3 ? "#ffffff" : hot;
    ctx.beginPath();
    ctx.arc(pts[i].x, pts[i].y, lerp(A.DOT_MAX_R, A.DOT_MIN_R, t), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // the drag itself, drawn where your thumb actually is
  ctx.strokeStyle = hexA(hot, .45); ctx.lineWidth = 2.5;
  ctx.setLineDash([5, 6]);
  ctx.beginPath(); ctx.moveTo(aim.sx, aim.sy); ctx.lineTo(aim.cx, aim.cy); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = hexA(hot, .3);
  ctx.beginPath(); ctx.arc(aim.sx, aim.sy, 7, 0, TAU); ctx.fill();
  ctx.strokeStyle = hexA(hot, .7); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(aim.cx, aim.cy, 13, 0, TAU); ctx.stroke();

  // power ring around the ball
  ctx.strokeStyle = hexA(v.power > .95 ? "#ff2e93" : hot, .85);
  ctx.lineWidth = 3.5; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r + 9, -Math.PI / 2, -Math.PI / 2 + TAU * v.power);
  ctx.stroke();
}

/* ---------- wind arrow ------------------------------------------- */
function drawWind() {
  if (Math.abs(G.wind) < 8) return;
  const x = W / 2, y = 168, dir = sign(G.wind);
  const strength = clamp(Math.abs(G.wind) / CONFIG.DIFFICULTY.WIND_MAX, .2, 1);
  const len = 26 + 40 * strength;
  ctx.save();
  ctx.globalAlpha = .9;
  ctx.strokeStyle = "#b6ff3a"; ctx.lineWidth = 3.4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x - dir * len / 2, y); ctx.lineTo(x + dir * len / 2, y); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + dir * len / 2, y);
  ctx.lineTo(x + dir * (len / 2 - 11), y - 8);
  ctx.moveTo(x + dir * len / 2, y);
  ctx.lineTo(x + dir * (len / 2 - 11), y + 8);
  ctx.stroke();
  // speed streaks
  ctx.globalAlpha = .35; ctx.lineWidth = 2;
  for (let i = 1; i <= 2; i++) {
    const o = i * 9;
    ctx.beginPath();
    ctx.moveTo(x - dir * len / 2 + dir * 6, y - o); ctx.lineTo(x + dir * (len / 2 - 14), y - o);
    ctx.moveTo(x - dir * len / 2 + dir * 6, y + o); ctx.lineTo(x + dir * (len / 2 - 14), y + o);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#b6ff3a"; ctx.font = '900 10px ' + FONT;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("WIND", x, y - 22);
  ctx.restore();
}

/* ---------- tier banner ------------------------------------------ */
let tierBanner = { text: "", t: 0 };
function showTierBanner(txt) { tierBanner.text = txt; tierBanner.t = 2.2; }
function drawTierBanner(dt) {
  if (tierBanner.t <= 0) return;
  tierBanner.t -= dt;
  const k = clamp(tierBanner.t / 2.2, 0, 1);
  const inK = clamp((2.2 - tierBanner.t) / .3, 0, 1);
  ctx.save();
  ctx.globalAlpha = Math.min(k < .25 ? k / .25 : 1, inK);
  ctx.translate(W / 2, 212);
  ctx.scale(easeOutBack(inK), easeOutBack(inK));
  ctx.font = '900 19px ' + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineWidth = 6; ctx.strokeStyle = "rgba(0,0,0,.6)";
  ctx.strokeText(tierBanner.text, 0, 0);
  ctx.fillStyle = "#ffb020"; ctx.fillText(tierBanner.text, 0, 0);
  ctx.restore();
}

/* ==================================================================
   17. MAIN DRAW
   ================================================================== */
function draw(dt) {
  if (bgDirty) paintBackdrop();
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.save();
  ctx.translate(Shake.x, Shake.y);

  ctx.drawImage(bgCanvas, 0, 0, W, H);

  drawObstacles();
  drawHoop();

  const pose = G.state === S.FLIGHT ? "shoot" : (aim.active ? "aim" : "idle");
  const st = (G.mode === "trick" && level) ? level.start : CONFIG.START;
  drawPlayer(ctx, st.x - 14, CONFIG.WORLD.FLOOR_Y, 1, pose, G.elapsed);

  drawBall();
  drawAim();
  drawP();
  drawWind();
  drawTierBanner(dt);
  drawPops();

  ctx.restore();
}

/* ==================================================================
   18. UPDATE
   ================================================================== */
function update(dt) {
  G.elapsed += dt;

  // clutch slow motion decays in REAL time, gameplay runs scaled
  if (G.slowT > 0) { G.slowT -= dt; G.timeScale = CONFIG.JUICE.SLOWMO_SCALE; }
  else if (aim.active) G.timeScale = CONFIG.AIM.AIM_SLOWDOWN;
  else G.timeScale = 1;

  const sdt = dt * G.timeScale;

  Shake.update(dt);
  updateFlash(dt);
  updateP(sdt);
  updatePops(dt);

  if (G.state === S.MENU || G.state === S.OVER || G.state === S.PAUSED) { updateHoop(sdt); updateObstacles(sdt); return; }

  // wind eases toward its target and gusts a little
  G.wind = lerp(G.wind, G.windTarget + Math.sin(G.elapsed * 1.7) * Math.abs(G.windTarget) * .18, 1 - Math.pow(.02, dt));

  updateHoop(sdt);
  updateObstacles(sdt);

  if (G.state === S.FLIGHT) {
    stepBall(sdt);
    maybeSlowmo();
    if (!ball.live && G.state === S.FLIGHT) { /* basket()/miss() already moved us on */ }
  }

  if (G.state === S.RESET) {
    G.resetT -= dt;
    if (G.resetT <= 0) nextShot();
  }

  // Time Attack clock
  if (G.mode === "time" && (G.state === S.AIM || G.state === S.FLIGHT || G.state === S.RESET)) {
    G.timeLeft -= dt;
    if (G.timeLeft <= 0) { G.timeLeft = 0; updateHUD(); endRun("time"); return; }
  }
  updateHUD();
}

function nextShot() {
  if (G.mode !== "trick") {
    const before = G.tier;
    applyDifficulty();
    if (G.tier > before) {
      const msgs = ["", "STEP BACK", "THE RIM MOVES", "IT BOBS NOW", "WIND PICKING UP", "TRAFFIC INCOMING",
                    "FASTER", "HARDER", "RELENTLESS", "RIM CITY MASTER"];
      showTierBanner(msgs[Math.min(G.tier, msgs.length - 1)] || "HARDER");
      Sound.levelUp(); flash(.12);
    }
  }
  resetBall();
  G.state = S.AIM;
}

/* ==================================================================
   19. INPUT  (one thumb: press, drag back, release)
   ================================================================== */
function toLocal(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function onDown(e) {
  Sound.init(); Sound.resume();
  if (G.state !== S.AIM) return;
  const p = toLocal(e);
  aim.active = true; aim.sx = aim.cx = p.x; aim.sy = aim.cy = p.y;
  hideCoach();
  e.preventDefault();
}
function onMove(e) {
  if (!aim.active) return;
  const p = toLocal(e);
  aim.cx = p.x; aim.cy = p.y;
  e.preventDefault();
}
function onUp(e) {
  if (!aim.active) return;
  aim.active = false;
  const v = aimVector();
  if (v.len < CONFIG.AIM.MIN_DRAG) return;       // too small: treat as a stray tap
  shoot(v.vx, v.vy, v.spin);
  G.state = S.FLIGHT;
  e.preventDefault();
}
cv.addEventListener("pointerdown", onDown, { passive: false });
window.addEventListener("pointermove", onMove, { passive: false });
window.addEventListener("pointerup", onUp, { passive: false });
window.addEventListener("pointercancel", () => { aim.active = false; });

/* ==================================================================
   20. GAME LOOP
   ================================================================== */
let last = performance.now(), acc = 0, running = true;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > .05) dt = .05;                 // never let a stall teleport the ball
  if (!running) return;
  update(dt);
  draw(dt);
}
requestAnimationFrame(frame);

document.addEventListener("visibilitychange", () => {
  if (document.hidden && (G.state === S.AIM || G.state === S.FLIGHT || G.state === S.RESET)) pause();
  last = performance.now();
});

/* ==================================================================
   21. UI: screens, HUD, shop, boards
   ================================================================== */
const SCREENS = ["scTitle","scModes","scLevels","scShop","scScores","scAch","scPause","scOver"];
let currentScreen = "scTitle";

function showScreen(id) {
  for (const s of SCREENS) $(s).classList.toggle("on", s === id);
  currentScreen = id;
  if (id) Sound.click();
}
function showHUD(on) { $("hud").classList.toggle("on", !!on); }

function updateHUD() {
  const sc = $("score");
  if (sc.textContent !== String(G.score)) sc.textContent = G.score;
  $("coinTxt").textContent = fmt(SAVE.coins);

  const cm = $("combo");
  if (G.fire) { cm.textContent = "🔥 FIRE x" + G.mult; cm.classList.add("on", "fire"); }
  else if (G.combo > 0) { cm.textContent = "COMBO x" + G.mult; cm.classList.add("on"); cm.classList.remove("fire"); }
  else { cm.classList.remove("on", "fire"); }

  const tm = $("timer");
  if (G.mode === "time") {
    tm.style.display = "";
    tm.textContent = Math.ceil(Math.max(0, G.timeLeft));
    tm.classList.toggle("low", G.timeLeft <= 10);
  } else tm.style.display = "none";
}
function bumpScoreUI() {
  const sc = $("score"), ch = $("coinChip");
  sc.classList.add("bump"); ch.classList.add("bump");
  setTimeout(() => { sc.classList.remove("bump"); ch.classList.remove("bump"); }, 150);
}
function updateLivesUI() {
  const box = $("lives");
  box.innerHTML = "";
  if (G.maxLives <= 1) return;                // Endless shows no hearts: you get one life, you know it
  for (let i = 0; i < G.maxLives; i++) {
    const d = document.createElement("div");
    d.className = "life" + (i < G.lives ? "" : " gone");
    box.appendChild(d);
  }
}
let coachT = 0;
function coachHint() {
  if (SAVE.stats.shots > 6) return;          // only nag a brand-new player
  $("coach").classList.add("on");
  clearTimeout(coachT);
  coachT = setTimeout(hideCoach, 6000);
}
function hideCoach() { $("coach").classList.remove("on"); }

/* ---------- pause ------------------------------------------------ */
function pause() {
  if (G.state === S.OVER || G.state === S.MENU) return;
  G._resume = G.state;
  G.state = S.PAUSED;
  aim.active = false;
  showScreen("scPause");
}
function resume() {
  G.state = G._resume || S.AIM;
  showScreen(null);
  last = performance.now();
}

/* ---------- shop -------------------------------------------------- */
let shopTab = "balls";
function renderShop() {
  $("shopCoins").textContent = fmt(SAVE.coins);
  const grid = $("shopGrid");
  grid.innerHTML = "";
  const items = shopTab === "balls" ? BALLS : COURTS;
  const owned = shopTab === "balls" ? SAVE.ownedBalls : SAVE.ownedCourts;
  const equipped = shopTab === "balls" ? SAVE.ball : SAVE.court;

  for (const it of items) {
    const has = owned.includes(it.id), eq = equipped === it.id;
    const card = document.createElement("div");
    card.className = "card" + (has ? " owned" : " locked") + (eq ? " equipped" : "");

    const c = document.createElement("canvas");
    c.width = 112; c.height = 112;
    const g = c.getContext("2d");
    g.scale(2, 2);
    if (shopTab === "balls") drawBallAt(g, 28, 28, 22, .35, it, it.id === "flaming");
    else drawCourtSwatch(g, it);
    card.appendChild(c);

    const nm = document.createElement("div"); nm.className = "cn"; nm.textContent = it.name;
    const bl = document.createElement("div"); bl.className = "cs"; bl.textContent = it.blurb;
    const pr = document.createElement("div");
    pr.className = "cp" + (eq ? " eq" : "");
    pr.textContent = eq ? "EQUIPPED" : (has ? "TAP TO EQUIP" : "● " + it.price);
    card.append(nm, bl, pr);

    card.onclick = () => {
      if (eq) return;
      if (has) {
        if (shopTab === "balls") SAVE.ball = it.id; else { SAVE.court = it.id; bgDirty = true; }
        Sound.click(); haptic(10);
      } else if (SAVE.coins >= it.price) {
        SAVE.coins -= it.price;
        owned.push(it.id);
        if (shopTab === "balls") SAVE.ball = it.id; else { SAVE.court = it.id; bgDirty = true; }
        Sound.buy(); haptic([10, 30, 10]);
        toast("⭐", "Unlocked " + it.name, "-" + it.price + " coins");
        checkAchievements();
      } else {
        Sound.fail(); haptic(30);
        toast("🔒", "Not enough coins", "You need " + (it.price - SAVE.coins) + " more");
        return;
      }
      saveNow(); renderShop(); resetBall();
    };
    grid.appendChild(card);
  }
}
function drawCourtSwatch(g, c) {
  const grd = g.createLinearGradient(0, 0, 0, 56);
  grd.addColorStop(0, c.sky[0]); grd.addColorStop(1, c.sky[1]);
  g.fillStyle = grd; rr(g, 0, 0, 56, 56, 10); g.fill();
  g.fillStyle = c.floor; rr(g, 0, 38, 56, 18, 8); g.fill();
  g.strokeStyle = c.glow; g.lineWidth = 2;
  g.beginPath(); g.moveTo(3, 39); g.lineTo(53, 39); g.stroke();
  g.fillStyle = c.accent;
  g.beginPath(); g.arc(40, 20, 6, 0, TAU); g.fill();
  g.strokeStyle = hexA(c.glow, .6); g.lineWidth = 1.4;
  rr(g, 1, 1, 54, 54, 10); g.stroke();
}

/* ---------- high scores + achievements ---------------------------- */
const MODE_LABEL = { endless: "Endless", time: "Time", trick: "Trick" };
function renderScores() {
  const list = $("scoreList");
  list.innerHTML = "";
  if (!SAVE.scores.length) {
    list.innerHTML = '<div class="li"><span class="nm" style="color:#8a8fb5;font-weight:700">No runs yet. Go get one.</span></div>';
    return;
  }
  SAVE.scores.forEach((s, i) => {
    const el = document.createElement("div");
    el.className = "li" + (s.name === SAVE.name ? " me" : "");
    el.innerHTML = '<span class="rk"></span><span class="nm"></span><span class="md"></span><span class="sc"></span>';
    el.querySelector(".rk").textContent = (i + 1);
    el.querySelector(".nm").textContent = s.name;
    el.querySelector(".md").textContent = MODE_LABEL[s.mode] || s.mode;
    el.querySelector(".sc").textContent = fmt(s.score);
    list.appendChild(el);
  });
}
function renderAch() {
  const list = $("achList");
  list.innerHTML = "";
  $("achCount").textContent = SAVE.ach.length + " of " + ACHIEVEMENTS.length + " unlocked";
  for (const a of ACHIEVEMENTS) {
    const got = SAVE.ach.includes(a.id);
    const el = document.createElement("div");
    el.className = "ach" + (got ? " got" : "");
    el.innerHTML = '<span class="ic"></span><span class="tx"><b></b><span></span></span>';
    el.querySelector(".ic").textContent = a.ic;
    el.querySelector("b").textContent = got ? a.name : "???";
    el.querySelector(".tx span").textContent = a.desc;
    list.appendChild(el);
  }
}
function renderLevels() {
  const grid = $("lvGrid");
  grid.innerHTML = "";
  LEVELS.forEach((lv, i) => {
    const done = SAVE.levels.includes(i);
    const open = i === 0 || SAVE.levels.includes(i - 1);
    const b = document.createElement("button");
    b.className = "lv " + (done ? "done" : open ? "open" : "lock");
    b.textContent = done ? "✓" : (i + 1);
    b.title = lv.n;
    b.onclick = () => {
      if (!open && !done) { Sound.fail(); toast("🔒", "Locked", "Clear level " + i + " first"); return; }
      startRun("trick", i);
    };
    grid.appendChild(b);
  });
}
function renderBests() {
  $("bestEndless").textContent = SAVE.best.endless ? "BEST " + fmt(SAVE.best.endless) : "";
  $("bestTime").textContent = SAVE.best.time ? "BEST " + fmt(SAVE.best.time) : "";
  $("bestTrick").textContent = SAVE.levels.length + "/" + LEVELS.length;
}

/* ---------- game over -------------------------------------------- */
let goRAF = 0, goT = 0;
function buildGameOver(reason) {
  const titles = {
    miss:    "Run over",
    time:    "Time up",
    failed:  "Out of tries",
    cleared: "Level clear"
  };
  $("overTitle").textContent = titles[reason] || "Run over";
  $("overScore").textContent = G.mode === "trick" ? SAVE.levels.length + "/" + LEVELS.length : fmt(G.score);
  $("overBest").innerHTML = G.newBest
    ? '<div class="newbest">New personal best</div>'
    : '<div class="sub">' + (G.mode === "trick"
        ? (reason === "cleared" ? "“" + LEVELS[G.level].n + "” cleared" : "Give it another run")
        : "Best " + fmt(SAVE.best[G.mode] || 0)) + '</div>';
  $("stBaskets").textContent = G.baskets;
  $("stSwish").textContent = G.swishes;
  $("stCombo").textContent = "x" + comboMultFor(G.bestCombo);
  $("stCoins").textContent = G.coinsRun;

  if (reason === "cleared" || G.newBest) { Sound.cheer(); }
  startGoAnim();
}
function comboMultFor(c) {
  const C = CONFIG.SCORING;
  return c >= C.FIRE_AT ? C.FIRE_MULT : C.COMBO_STEPS[Math.min(c, C.COMBO_STEPS.length - 1)];
}
/* the celebrating avatar on the results screen */
function startGoAnim() {
  cancelAnimationFrame(goRAF);
  const c = $("goCanvas"), g = c.getContext("2d");
  goT = 0;
  const confs = [];
  for (let i = 0; i < 26; i++)
    confs.push({ x: rand(20, 280), y: rand(-200, 0), vy: rand(50, 130), r: rand(3, 7),
                 c: pick(["#22e6ff","#ff2e93","#ffb020","#b6ff3a","#ffffff"]), rot: rand(0, TAU), vr: rand(-4, 4) });
  let prev = performance.now();
  (function loop(now) {
    if (currentScreen !== "scOver") return;
    goRAF = requestAnimationFrame(loop);
    const dt = Math.min(.05, (now - prev) / 1000); prev = now; goT += dt;
    g.clearRect(0, 0, 300, 300);
    // glow pad
    const rg = g.createRadialGradient(150, 250, 6, 150, 250, 130);
    rg.addColorStop(0, "rgba(139,92,246,.45)"); rg.addColorStop(1, "rgba(139,92,246,0)");
    g.fillStyle = rg; g.fillRect(0, 120, 300, 180);
    for (const p of confs) {
      p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.y > 300) { p.y = -10; p.x = rand(20, 280); }
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
      g.fillStyle = p.c; g.fillRect(-p.r, -p.r * .5, p.r * 2, p.r); g.restore();
    }
    g.save(); g.translate(150, 262); g.scale(1.25, 1.25);
    drawPlayer(g, 0, 0, 1, "celebrate", goT);
    g.restore();
    // name tag
    g.font = '900 17px ' + FONT; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = "#f2f4ff";
    g.fillText((SAVE.name || "YOU") + " · #" + CONFIG.PLAYER.NUMBER, 150, 288);
  })(prev);
}

/* ---------- share ------------------------------------------------- */
function shareText() {
  const L = [];
  L.push("🏀 " + CONFIG.GAME_NAME);
  if (G.mode === "trick") {
    L.push((SAVE.name || "YOU") + " — " + SAVE.levels.length + "/" + LEVELS.length + " trick shots cleared");
  } else {
    L.push((SAVE.name || "YOU") + " — " + fmt(G.score) + " pts (" + MODE_LABEL[G.mode] + ")");
    L.push(G.baskets + " baskets · " + G.swishes + " swishes · best combo x" + comboMultFor(G.bestCombo));
  }
  if (G.newBest) L.push("⭐ New personal best");
  L.push('"' + CONFIG.TAGLINE + '"');
  return L.join("\n");
}
async function copyShare() {
  const txt = shareText();
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; }
  catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand("copy");
      ta.remove();
    } catch (e2) { ok = false; }
  }
  Sound.click(); haptic(12);
  toast(ok ? "📋" : "⚠️", ok ? "Copied to clipboard" : "Copy failed", ok ? "Paste it anywhere" : "Long-press to copy manually");
}

/* ==================================================================
   22. WIRING
   ================================================================== */
$("btnPlay").onclick = () => { Sound.init(); Sound.resume(); renderBests(); showScreen("scModes"); };
$("btnShop").onclick = () => { renderShop(); showScreen("scShop"); };
$("btnScores").onclick = () => { renderScores(); showScreen("scScores"); };
$("btnAch").onclick = () => { renderAch(); showScreen("scAch"); };
document.querySelectorAll("[data-back]").forEach(b => b.onclick = () => showScreen(b.dataset.back));
document.querySelectorAll(".mode").forEach(b => b.onclick = () => {
  const m = b.dataset.mode;
  if (m === "trick") { renderLevels(); showScreen("scLevels"); }
  else startRun(m);
});
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  shopTab = t.dataset.tab; renderShop(); Sound.click();
});
$("btnPause").onclick = pause;
$("btnResume").onclick = resume;
$("btnRestart").onclick = () => startRun(G.mode, G.level);
$("btnQuit").onclick = () => { G.state = S.MENU; showHUD(false); renderBests(); showScreen("scTitle"); };
$("btnAgain").onclick = () => {
  if (G.mode === "trick") {
    // after a clear, roll straight into the next locked level
    const nxt = G.level + 1;
    if (SAVE.levels.includes(G.level) && nxt < LEVELS.length) startRun("trick", nxt);
    else startRun("trick", G.level);
  } else startRun(G.mode);
};
$("btnMenu").onclick = () => { G.state = S.MENU; renderBests(); showScreen("scTitle"); };
$("btnShare").onclick = copyShare;
$("btnWipe").onclick = () => {
  SAVE.scores = []; saveNow(); renderScores();
  toast("🧹", "Board cleared", "Fresh start");
};

function setMute(m) {
  SAVE.muted = m; Sound.setMuted(m); saveNow();
  const ic = m ? "🔇" : "🔊";
  $("btnMute").textContent = ic; $("btnMute2").textContent = ic;
}
$("btnMute").onclick = () => { Sound.init(); setMute(!SAVE.muted); Sound.click(); };
$("btnMute2").onclick = () => { setMute(!SAVE.muted); Sound.click(); };

const nameIn = $("nameInput");
nameIn.value = SAVE.name || CONFIG.PLAYER.NAME;
nameIn.oninput = () => {
  SAVE.name = (nameIn.value || "").toUpperCase().replace(/[^A-Z0-9 ]/g, "").slice(0, 8) || "YOU";
  nameIn.value = SAVE.name;
  save();
};
nameIn.onblur = () => { if (!nameIn.value) { nameIn.value = "YOU"; SAVE.name = "YOU"; saveNow(); } };

// keyboard convenience for desktop testing
window.addEventListener("keydown", e => {
  if (e.key === "Escape" || e.key === "p") { G.state === S.PAUSED ? resume() : pause(); }
  if (e.key === "m") setMute(!SAVE.muted);
});

/* ==================================================================
   23. PWA: manifest + icon are generated at runtime so this stays a
   genuinely single file. Drop a sw.js next to it for offline play and
   it will be picked up automatically.
   ================================================================== */
function makeIcon(size) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  g.fillStyle = "#07070d"; g.fillRect(0, 0, size, size);
  const rg = g.createRadialGradient(size * .5, size * .45, size * .05, size * .5, size * .5, size * .55);
  rg.addColorStop(0, "rgba(34,230,255,.4)"); rg.addColorStop(1, "rgba(34,230,255,0)");
  g.fillStyle = rg; g.fillRect(0, 0, size, size);
  const s = size / 112;
  g.save(); g.translate(size / 2, size / 2); g.scale(s, s);
  drawBallAt(g, 0, 0, 38, .3, BALLS[0], false);
  g.restore();
  return c.toDataURL("image/png");
}
function installPWA() {
  try {
    const icon = makeIcon(192), icon512 = makeIcon(512);
    const manifest = {
      name: CONFIG.GAME_NAME, short_name: CONFIG.GAME_NAME,
      description: CONFIG.TAGLINE,
      start_url: ".", scope: ".", display: "fullscreen", orientation: "portrait",
      background_color: "#07070d", theme_color: "#07070d",
      icons: [
        { src: icon, sizes: "192x192", type: "image/png", purpose: "any" },
        { src: icon512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    const link = document.createElement("link");
    link.rel = "manifest"; link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);
    const ic = document.createElement("link");
    ic.rel = "apple-touch-icon"; ic.href = icon;
    document.head.appendChild(ic);
  } catch (e) {}
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});   // optional, silently skipped
  }
}

/* ==================================================================
   24. BOOT
   ================================================================== */
function init() {
  resize();
  setMute(SAVE.muted);
  renderBests();
  resetBall();
  hoop.baseX = hoop.x = hoop.tx = 320;
  hoop.baseY = hoop.y = hoop.ty = 380;
  G.state = S.MENU;

  // daily streak
  const st = checkDailyStreak();
  const wrap = $("streakWrap");
  if (st) {
    wrap.innerHTML = '<div id="streak"><span class="f">🔥</span><span>Day ' + st.days + ' streak · +' + st.reward + ' coins</span></div>';
    setTimeout(() => { Sound.coin(); toast("🔥", "Day " + st.days + " streak", "+" + st.reward + " coins banked"); }, 900);
  } else if (SAVE.streak.days > 1) {
    wrap.innerHTML = '<div id="streak"><span class="f">🔥</span><span>Day ' + SAVE.streak.days + ' streak · come back tomorrow</span></div>';
  }

  installPWA();
  // unlock audio on the first touch anywhere
  const unlock = () => { Sound.init(); Sound.resume(); window.removeEventListener("pointerdown", unlock); };
  window.addEventListener("pointerdown", unlock);
}
init();
