<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="RIM CITY - one-thumb arcade basketball. Own every angle.">
<title>RIM CITY</title>
<style>
/* ============================================================
   RIM CITY - flat neon-on-dark art direction
   near-black court / electric cyan / hot magenta / amber / lime
   ============================================================ */
:root{
  --bg:#07070d;
  --bg2:#0f0f1e;
  --panel:rgba(16,16,32,.92);
  --cyan:#22e6ff;
  --magenta:#ff2e93;
  --amber:#ffb020;
  --lime:#b6ff3a;
  --ink:#f2f4ff;
  --dim:#8a8fb5;
  --purple:#8b5cf6;
  --ease:cubic-bezier(.22,1,.36,1);
  --pop:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;background:#000;overflow:hidden;
  font-family:"Arial Rounded MT Bold","Nunito","Baloo 2",ui-rounded,"Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--ink);
  touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}
body{display:flex;align-items:center;justify-content:center}

/* ---- 9:16 letterboxed stage ---- */
#stage{
  position:relative;aspect-ratio:9/16;
  height:100dvh;max-height:100dvh;width:auto;max-width:100vw;
  background:var(--bg);overflow:hidden;
  box-shadow:0 0 90px rgba(34,230,255,.09);
}
@media (max-aspect-ratio:9/16){ #stage{width:100vw;height:auto} }
#game{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---- generic screen layer ---- */
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  padding:26px 22px;z-index:20;
  opacity:0;pointer-events:none;transform:translateY(14px) scale(.985);
  transition:opacity .34s var(--ease),transform .42s var(--ease);
  background:radial-gradient(120% 90% at 50% 0%,rgba(20,20,45,.86),rgba(4,4,10,.96));
  backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
}
.screen.on{opacity:1;pointer-events:auto;transform:none}
.screen.scroll{justify-content:flex-start;overflow-y:auto;overscroll-behavior:contain}

/* ---- type ---- */
.logo{
  font-size:clamp(44px,13vw,78px);line-height:.88;letter-spacing:-.035em;
  text-align:center;font-weight:900;
  background:linear-gradient(175deg,var(--cyan) 6%,#77aaff 40%,var(--magenta) 96%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(34,230,255,.4));
}
.tag{font-size:13px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase;text-align:center}
.h2{font-size:24px;letter-spacing:.06em;color:var(--ink);text-transform:uppercase}
.sub{font-size:12.5px;color:var(--dim);text-align:center;line-height:1.55;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}

/* ---- buttons ---- */
.btn{
  position:relative;border:0;cursor:pointer;font:inherit;font-weight:900;
  padding:15px 26px;border-radius:17px;min-width:214px;
  font-size:17px;letter-spacing:.11em;text-transform:uppercase;
  color:#04040a;background:linear-gradient(180deg,var(--cyan),#12b9d8);
  box-shadow:0 7px 0 #0a7f97,0 12px 26px rgba(34,230,255,.3);
  transition:transform .13s var(--pop),box-shadow .13s var(--ease),filter .2s;
}
.btn:active{transform:translateY(6px) scale(.985);box-shadow:0 1px 0 #0a7f97,0 4px 12px rgba(34,230,255,.22)}
.btn.pink{background:linear-gradient(180deg,var(--magenta),#c9166d);box-shadow:0 7px 0 #8c0f4c,0 12px 26px rgba(255,46,147,.3);color:#fff}
.btn.pink:active{box-shadow:0 1px 0 #8c0f4c,0 4px 12px rgba(255,46,147,.22)}
.btn.gold{background:linear-gradient(180deg,var(--amber),#d47f00);box-shadow:0 7px 0 #8d5500,0 12px 26px rgba(255,176,32,.28)}
.btn.gold:active{box-shadow:0 1px 0 #8d5500,0 4px 12px rgba(255,176,32,.2)}
.btn.ghost{
  background:transparent;color:var(--ink);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.17);padding:13px 22px;font-size:14px;min-width:170px;
}
.btn.ghost:active{transform:scale(.96);box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.btn.sm{min-width:0;padding:11px 18px;font-size:13px;border-radius:13px}
.btn[disabled]{filter:grayscale(.85) brightness(.62);pointer-events:none}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}

/* ---- HUD ---- */
#hud{position:absolute;inset:0;z-index:10;pointer-events:none;
  padding:calc(12px + env(safe-area-inset-top)) 14px 0;
  opacity:0;transition:opacity .3s var(--ease)}
#hud.on{opacity:1}
#hudTop{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.icobtn{
  pointer-events:auto;width:44px;height:44px;border:0;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.13);
  color:var(--ink);font-size:17px;display:grid;place-items:center;
  transition:transform .14s var(--pop),background .2s;backdrop-filter:blur(6px);
}
.icobtn:active{transform:scale(.88);background:rgba(255,255,255,.15)}
#scoreWrap{text-align:center;flex:1;margin-top:-2px}
#score{font-size:56px;font-weight:900;line-height:.92;letter-spacing:-.03em;
  text-shadow:0 0 26px rgba(34,230,255,.55),0 3px 0 rgba(0,0,0,.5);
  transition:transform .13s var(--pop),color .2s}
#score.bump{transform:scale(1.22)}
#combo{font-size:14px;font-weight:900;letter-spacing:.2em;color:var(--amber);height:18px;
  opacity:0;transform:translateY(-6px) scale(.9);
  transition:opacity .22s var(--ease),transform .3s var(--pop),color .2s}
#combo.on{opacity:1;transform:none}
#combo.fire{color:var(--magenta);text-shadow:0 0 16px rgba(255,46,147,.8)}
#rightCol{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.chip{
  display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px;
  background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12);
  font-size:14px;font-weight:900;letter-spacing:.04em;backdrop-filter:blur(6px);
  transition:transform .14s var(--pop)}
.chip.bump{transform:scale(1.14)}
.chip .dot{width:11px;height:11px;border-radius:50%;background:var(--amber);box-shadow:0 0 9px var(--amber)}
#lives{display:flex;gap:5px;margin-top:2px}
.life{width:11px;height:11px;border-radius:50%;background:var(--magenta);
  box-shadow:0 0 10px rgba(255,46,147,.85);transition:all .3s var(--pop)}
.life.gone{background:rgba(255,255,255,.13);box-shadow:none;transform:scale(.62)}
#timer{font-size:22px;font-weight:900;letter-spacing:.04em;color:var(--cyan)}
#timer.low{color:var(--magenta);animation:pulse .55s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
#objective{
  position:absolute;left:0;right:0;top:120px;text-align:center;font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--lime);padding:0 26px;
  text-shadow:0 0 14px rgba(182,255,58,.5)}

/* ---- toasts (achievements) ---- */
#toasts{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));
  z-index:40;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{
  display:flex;align-items:center;gap:11px;padding:11px 17px 11px 13px;border-radius:15px;
  background:linear-gradient(120deg,rgba(255,176,32,.96),rgba(255,46,147,.94));
  color:#140a00;font-weight:900;max-width:100%;
  box-shadow:0 12px 30px rgba(0,0,0,.5);
  animation:toastIn .45s var(--pop) both,toastOut .4s var(--ease) 2.5s both;
}
.toast .ic{font-size:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.toast .tt{font-size:13.5px;letter-spacing:.06em;line-height:1.25}
.toast .ts{font-size:11px;opacity:.78;font-weight:700;letter-spacing:.02em}
@keyframes toastIn{from{opacity:0;transform:translateY(26px) scale(.86)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-10px) scale(.95)}}

/* ---- cards / shop ---- */
.panel{width:100%;max-width:340px;background:var(--panel);border-radius:22px;padding:16px;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08),0 18px 44px rgba(0,0,0,.5)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;width:100%;max-width:340px}
.card{
  position:relative;border-radius:17px;padding:11px 10px 10px;cursor:pointer;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.09);
  display:flex;flex-direction:column;align-items:center;gap:6px;overflow:hidden;
  transition:transform .16s var(--pop),box-shadow .22s var(--ease),background .22s}
.card:active{transform:scale(.955)}
.card.owned{box-shadow:inset 0 0 0 1.5px rgba(34,230,255,.4)}
.card.equipped{background:rgba(34,230,255,.12);box-shadow:inset 0 0 0 2.5px var(--cyan),0 0 26px rgba(34,230,255,.26)}
.card.locked{opacity:.66}
.card canvas{width:56px;height:56px;display:block}
.card .cn{font-size:12px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;text-align:center}
.card .cs{font-size:10px;color:var(--dim);text-align:center;line-height:1.35;min-height:26px;letter-spacing:.01em}
.card .cp{font-size:11.5px;font-weight:900;color:var(--amber);letter-spacing:.06em}
.card .cp.eq{color:var(--cyan)}
.tabs{display:flex;gap:8px;background:rgba(255,255,255,.05);padding:5px;border-radius:15px}
.tab{border:0;background:transparent;color:var(--dim);font:inherit;font-weight:900;font-size:12.5px;
  letter-spacing:.11em;text-transform:uppercase;padding:9px 18px;border-radius:11px;cursor:pointer;
  transition:all .24s var(--ease)}
.tab.on{background:rgba(34,230,255,.16);color:var(--cyan);box-shadow:inset 0 0 0 1.5px rgba(34,230,255,.34)}

/* ---- lists ---- */
.list{width:100%;max-width:340px;display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:13px;
  background:rgba(255,255,255,.045);font-size:13px;box-shadow:inset 0 0 0 1.2px rgba(255,255,255,.06)}
.li .rk{font-weight:900;color:var(--amber);width:23px;font-size:15px}
.li .nm{flex:1;font-weight:900;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .md{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.li .sc{font-weight:900;color:var(--cyan);font-size:15px}
.li.me{background:rgba(139,92,246,.17);box-shadow:inset 0 0 0 1.5px rgba(139,92,246,.45)}
.ach{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:13px;
  background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1.2px rgba(255,255,255,.06)}
.ach.got{background:rgba(182,255,58,.1);box-shadow:inset 0 0 0 1.4px rgba(182,255,58,.34)}
.ach .ic{font-size:21px;width:28px;text-align:center;filter:grayscale(1);opacity:.4}
.ach.got .ic{filter:none;opacity:1}
.ach .tx{flex:1}
.ach .tx b{display:block;font-size:12.5px;letter-spacing:.05em}
.ach .tx span{font-size:10.5px;color:var(--dim);letter-spacing:.02em}

/* ---- mode picker ---- */
.mode{
  width:100%;max-width:340px;display:flex;align-items:center;gap:13px;padding:15px 17px;border-radius:19px;
  cursor:pointer;border:0;font:inherit;color:var(--ink);text-align:left;
  background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.09);
  transition:transform .16s var(--pop),box-shadow .24s var(--ease),background .24s}
.mode:active{transform:scale(.97)}
.mode .mi{font-size:29px;width:38px;text-align:center}
.mode b{display:block;font-size:16.5px;letter-spacing:.08em;text-transform:uppercase}
.mode span{font-size:11.5px;color:var(--dim);letter-spacing:.02em}
.mode .best{margin-left:auto;font-size:11px;color:var(--amber);font-weight:900;text-align:right;letter-spacing:.04em}
.mode.c1{box-shadow:inset 0 0 0 1.5px rgba(34,230,255,.34)}
.mode.c2{box-shadow:inset 0 0 0 1.5px rgba(255,176,32,.34)}
.mode.c3{box-shadow:inset 0 0 0 1.5px rgba(255,46,147,.34)}

/* ---- level select ---- */
.lvGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:340px}
.lv{aspect-ratio:1;border:0;border-radius:14px;cursor:pointer;font:inherit;font-weight:900;font-size:17px;
  background:rgba(255,255,255,.05);color:var(--dim);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08);
  display:grid;place-items:center;transition:transform .15s var(--pop),all .22s var(--ease)}
.lv:active{transform:scale(.9)}
.lv.open{color:var(--cyan);box-shadow:inset 0 0 0 1.8px rgba(34,230,255,.45)}
.lv.done{background:linear-gradient(160deg,rgba(182,255,58,.22),rgba(34,230,255,.14));color:var(--lime);
  box-shadow:inset 0 0 0 1.8px rgba(182,255,58,.5)}
.lv.lock{opacity:.4}

/* ---- game over ---- */
#goCanvas{width:150px;height:150px;display:block;filter:drop-shadow(0 12px 22px rgba(0,0,0,.55))}
.bigscore{font-size:70px;font-weight:900;line-height:.9;letter-spacing:-.04em;
  background:linear-gradient(180deg,#ffffff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 20px rgba(34,230,255,.35))}
.statRow{display:flex;gap:9px;width:100%;max-width:340px}
.stat{flex:1;padding:10px 6px;border-radius:14px;background:rgba(255,255,255,.05);text-align:center;
  box-shadow:inset 0 0 0 1.2px rgba(255,255,255,.07)}
.stat b{display:block;font-size:20px;letter-spacing:-.01em}
.stat span{font-size:9.5px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.newbest{font-size:13px;font-weight:900;letter-spacing:.24em;color:var(--lime);text-transform:uppercase;
  animation:glowPulse 1.1s infinite}
@keyframes glowPulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}

/* ---- name input ---- */
.nameIn{
  background:rgba(255,255,255,.06);border:0;box-shadow:inset 0 0 0 1.6px rgba(255,255,255,.15);
  border-radius:13px;padding:11px 15px;color:var(--ink);font:inherit;font-weight:900;font-size:15px;
  letter-spacing:.14em;text-align:center;text-transform:uppercase;width:160px;outline:none;
  transition:box-shadow .24s var(--ease)}
.nameIn:focus{box-shadow:inset 0 0 0 2px var(--cyan),0 0 22px rgba(34,230,255,.24)}

/* ---- streak banner ---- */
#streak{display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:14px;
  background:linear-gradient(110deg,rgba(255,176,32,.2),rgba(255,46,147,.14));
  box-shadow:inset 0 0 0 1.4px rgba(255,176,32,.36);font-size:12px;font-weight:900;letter-spacing:.06em}
#streak .f{font-size:19px}

/* ---- coach text ---- */
#coach{position:absolute;left:0;right:0;bottom:4%;text-align:center;z-index:12;pointer-events:none;
  font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  opacity:0;transition:opacity .5s var(--ease)}
#coach.on{opacity:1;animation:floaty 2s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.fadeUp{animation:fadeUp .5s var(--ease) both}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.spacer{height:6px}
#flash{position:absolute;inset:0;z-index:30;pointer-events:none;background:#fff;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="flash"></div>

  <!-- ============ IN-GAME HUD ============ -->
  <div id="hud">
    <div id="hudTop">
      <button class="icobtn" id="btnPause" aria-label="Pause">&#10074;&#10074;</button>
      <div id="scoreWrap">
        <div id="score" class="num">0</div>
        <div id="combo"></div>
      </div>
      <div id="rightCol">
        <div class="chip" id="coinChip"><span class="dot"></span><span id="coinTxt" class="num">0</span></div>
        <div id="timer" class="num" style="display:none">60</div>
        <div id="lives"></div>
      </div>
    </div>
    <div id="objective"></div>
  </div>
  <div id="coach">pull back &amp; release to shoot</div>

  <!-- ============ TITLE ============ -->
  <section class="screen on" id="scTitle">
    <div class="fadeUp">
      <div class="logo">RIM<br>CITY</div>
    </div>
    <div class="tag fadeUp d1">Own every angle.</div>
    <div class="spacer"></div>
    <div id="streakWrap" class="fadeUp d2"></div>
    <div class="row fadeUp d2"><button class="btn" id="btnPlay">Play</button></div>
    <div class="row fadeUp d3">
      <button class="btn ghost sm" id="btnShop">&#9733; Shop</button>
      <button class="btn ghost sm" id="btnScores">&#127942; Scores</button>
      <button class="btn ghost sm" id="btnAch">&#128081; Awards</button>
    </div>
    <div class="row fadeUp d4" style="margin-top:4px">
      <input class="nameIn" id="nameInput" maxlength="8" value="HEN" aria-label="Player name">
      <button class="icobtn" id="btnMute" aria-label="Mute">&#128266;</button>
    </div>
    <div class="sub fadeUp d4" style="margin-top:2px">tap the name to change it</div>
  </section>

  <!-- ============ MODE SELECT ============ -->
  <section class="screen" id="scModes">
    <div class="h2">Pick a mode</div>
    <div class="spacer"></div>
    <button class="mode c1" data-mode="endless">
      <span class="mi">&#9889;</span>
      <span><b>Endless</b><span>One miss and the run is over</span></span>
      <span class="best" id="bestEndless"></span>
    </button>
    <button class="mode c2" data-mode="time">
      <span class="mi">&#9201;</span>
      <span><b>Time Attack</b><span>60 seconds. Score everything.</span></span>
      <span class="best" id="bestTime"></span>
    </button>
    <button class="mode c3" data-mode="trick">
      <span class="mi">&#127919;</span>
      <span><b>Trick Shot</b><span>15 handcrafted bank &amp; bounce puzzles</span></span>
      <span class="best" id="bestTrick"></span>
    </button>
    <div class="spacer"></div>
    <button class="btn ghost sm" data-back="scTitle">Back</button>
  </section>

  <!-- ============ TRICK SHOT LEVEL SELECT ============ -->
  <section class="screen scroll" id="scLevels">
    <div class="spacer"></div>
    <div class="h2">Trick Shot</div>
    <div class="sub">Three attempts per level. Clear one to open the next.</div>
    <div class="spacer"></div>
    <div class="lvGrid" id="lvGrid"></div>
    <div class="spacer"></div>
    <button class="btn ghost sm" data-back="scModes">Back</button>
  </section>

  <!-- ============ SHOP ============ -->
  <section class="screen scroll" id="scShop">
    <div class="spacer"></div>
    <div class="row" style="width:100%;justify-content:space-between;max-width:340px">
      <div class="h2">Shop</div>
      <div class="chip"><span class="dot"></span><span id="shopCoins" class="num">0</span></div>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="balls">Balls</button>
      <button class="tab" data-tab="courts">Courts</button>
    </div>
    <div class="grid" id="shopGrid"></div>
    <div class="spacer"></div>
    <button class="btn ghost sm" data-back="scTitle">Back</button>
    <div class="spacer"></div>
  </section>

  <!-- ============ HIGH SCORES ============ -->
  <section class="screen scroll" id="scScores">
    <div class="spacer"></div>
    <div class="h2">&#127942; Hall of Rim</div>
    <div class="sub">Local board. Ten best runs on this device.</div>
    <div class="spacer"></div>
    <div class="list" id="scoreList"></div>
    <div class="spacer"></div>
    <div class="row">
      <button class="btn ghost sm" data-back="scTitle">Back</button>
      <button class="btn ghost sm" id="btnWipe">Clear board</button>
    </div>
    <div class="spacer"></div>
  </section>

  <!-- ============ ACHIEVEMENTS ============ -->
  <section class="screen scroll" id="scAch">
    <div class="spacer"></div>
    <div class="h2">&#128081; Awards</div>
    <div class="sub" id="achCount"></div>
    <div class="spacer"></div>
    <div class="list" id="achList"></div>
    <div class="spacer"></div>
    <button class="btn ghost sm" data-back="scTitle">Back</button>
    <div class="spacer"></div>
  </section>

  <!-- ============ PAUSE ============ -->
  <section class="screen" id="scPause">
    <div class="h2">Paused</div>
    <div class="spacer"></div>
    <button class="btn" id="btnResume">Resume</button>
    <button class="btn ghost sm" id="btnRestart">Restart</button>
    <button class="btn ghost sm" id="btnQuit">Quit to menu</button>

const lerp = (a, b, t) => a + (b - a) * t;

const easeOutBack = t => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2);
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

let SAVE = loadSave();

function loadSave() {
  try {
    const raw = localStorage.getItem(CONFIG.SAVE_KEY);
    if (!raw) return structuredClone(DEFAULT_SAVE);
    const parsed = JSON.parse(raw);
    // shallow-merge so a save from an older build never breaks a new one
    const s = structuredClone(DEFAULT_SAVE);
    for (const k in parsed) {
      if (k === "stats" || k === "best" || k === "streak") Object.assign(s[k], parsed[k]);
      else s[k] = parsed[k];
    }
    return s;
  } catch (e) { return structuredClone(DEFAULT_SAVE); }
}
let saveTimer = 0;
function save() {                       // debounced: never thrash storage mid-frame
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {}
  }, 220);
}
function saveNow() {
  clearTimeout(saveTimer);
  try { localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {}
}

/* ==================================================================
   3. AUDIO ENGINE
   Every sound is synthesized at runtime with WebAudio - no files,
   which keeps this a genuinely single-file game.
   ================================================================== */
const Sound = (() => {
  let ctx = null, master = null, noiseBuf = null, ready = false;

  function init() {
    if (ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = SAVE.muted ? 0 : CONFIG.AUDIO.MASTER;
    master.connect(ctx.destination);
    // one second of white noise, reused by every noise-based sound
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    ready = true;
  }
  function resume() { if (ctx && ctx.state === "suspended") ctx.resume(); }
  const now = () => ctx.currentTime;

  function tone(freq, dur, type, vol, slideTo, delay) {
    if (!ready) return;
    const t = now() + (delay || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime((vol || .3) * CONFIG.AUDIO.SFX, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + dur + .05);
  }
  function noise(dur, vol, filterType, f0, f1, q, delay) {
    if (!ready) return;
    const t = now() + (delay || 0);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const flt = ctx.createBiquadFilter();
    flt.type = filterType || "bandpass";
    flt.frequency.setValueAtTime(f0, t);
    if (f1) flt.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    flt.Q.value = q || 1;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime((vol || .3) * CONFIG.AUDIO.SFX, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt).connect(g).connect(master);
    src.start(t); src.stop(t + dur + .05);
  }

  return {
    init, resume,
    setMuted(m) { if (master) master.gain.value = m ? 0 : CONFIG.AUDIO.MASTER; },
    /* cloth rush through the net */
    swish() { noise(.34, .38, "bandpass", 5200, 900, 1.3); tone(880, .12, "sine", .1, 1320); },
    /* iron on iron */
    clank() { tone(1180, .22, "square", .16, 470); tone(1760, .13, "triangle", .1, 900); noise(.09, .16, "highpass", 2600, 1800, .8); },
    /* dull plexiglass thud */
    board() { tone(240, .17, "triangle", .2, 150); noise(.08, .12, "lowpass", 900, 400, .7); },
    /* ball on concrete */
    bounce(v) { const p = clamp(v / 700, .25, 1); tone(150 + 90 * p, .1, "sine", .17 * p, 70); noise(.05, .08 * p, "lowpass", 700, 300, .6); },
    /* leather leaving your hand */
    whoosh(p) { noise(.2, .16 + .1 * p, "bandpass", 500 + 900 * p, 2400, .9); },
    coin() { tone(1320, .09, "square", .14, 1760); tone(1980, .1, "square", .1, 2640, .05); },
    cheer() {
      noise(.95, CONFIG.AUDIO.CROWD * .34, "bandpass", 700, 1900, .55);
      noise(.75, CONFIG.AUDIO.CROWD * .2, "highpass", 2400, 3600, .5, .08);
      for (let i = 0; i < 6; i++) tone(rand(500, 1200), .3, "triangle", .035, rand(700, 1500), i * .05);
    },
    fire() { tone(180, .5, "sawtooth", .2, 720); noise(.55, .22, "bandpass", 400, 2800, .8); tone(660, .35, "square", .1, 1320, .06); },
    levelUp() {[0, .09, .18, .3].forEach((d, i) => tone([660, 880, 1100, 1480][i], .26, "triangle", .2, null, d)); },
    fail() { tone(300, .4, "sawtooth", .17, 90); noise(.3, .1, "lowpass", 700, 200, .7); },
    click() { tone(760, .05, "square", .1, 520); },
    buy() { tone(880, .1, "triangle", .18, 1320); tone(1320, .14, "triangle", .14, 1760, .07); }
  };
})();

}
